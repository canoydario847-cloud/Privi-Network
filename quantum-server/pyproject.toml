[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privi-quantum-mcp"
version = "0.7.0"
description = "Quantum optimization (CVaR-QAOA) for manufacturing decisions, with post-quantum signed results anchored on the Privi blockchain, as an MCP server."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Privi World Co" }, { name = "Dario Canoy" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "uvicorn>=0.30", "cryptography>=50", "numpy>=1.26", "scipy>=1.11", "httpx2>=2.10", "websockets>=13"]
keywords = ["mcp", "quantum computing", "qaoa", "post-quantum", "ml-dsa", "manufacturing", "optimization", "blockchain", "ionq", "ibm quantum", "amazon braket", "cbom", "ml-kem"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]
hardware = ["qiskit>=1.3", "qiskit-ibm-runtime>=0.30", "boto3>=1.34"]

[project.scripts]
privi-quantum-mcp = "privi_quantum.server:main"

[project.urls]
Homepage = "https://github.com/canoydario847-cloud/Privi-Network/tree/main/quantum-server"

[tool.hatch.build.targets.wheel]
packages = ["src/privi_quantum"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
