<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e1b"><title>Hey Jose · Luna Light 5.6 | Privi World</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#090e1b;--panel:#111a2a;--panel2:#182235;--line:#2d394d;--text:#f3f5fa;--muted:#aeb8ca;--gold:#f5c582;--blue:#9fc9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button,a{color:inherit}button{cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{height:100vh;position:sticky;top:0;background:#0d1422;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:15px 12px;gap:10px}.brand{display:flex;align-items:center;gap:10px;font-family:"Cinzel Decorative",serif;font-weight:700;font-size:15px;letter-spacing:.02em;padding:5px 8px 14px;color:#ffd98e;text-shadow:0 0 12px #d77b3d66}.mark{width:24px;height:24px;border:2px solid var(--gold);border-radius:50%;position:relative}.mark:after{content:"";position:absolute;inset:6px -7px;border:1px solid var(--gold);border-radius:50%;transform:rotate(-30deg)}.sidebtn,.plugin-btn{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:10px;border:1px solid transparent;background:transparent;border-radius:9px;color:#e4e9f1}.sidebtn:hover,.plugin-btn:hover{background:var(--panel2)}.sidebtn.add{border-color:#3b465a;background:#131d2e}.smallhead{color:#929db0;text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:700;margin:14px 8px 2px}.plugins{overflow:auto;flex:1}.plugin-btn{font-size:13px;justify-content:space-between}.plugin-btn .left{display:flex;align-items:center;gap:9px}.pill{color:var(--muted);font-size:10px}.bottom{border-top:1px solid var(--line);padding:12px 6px 3px;color:var(--muted);font-size:12px}.bottom button{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 9px;margin-top:7px}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0b1220}.top strong{font-family:"Cinzel Decorative",serif;font-size:14px;color:#ffd98e;text-shadow:0 0 9px #d77b3d55}.top .right{display:flex;gap:10px;align-items:center}.subtle{color:var(--muted)}.top button,.btn{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--panel2);color:var(--text)}.view{flex:1;min-height:0}.welcome{height:calc(100vh - 58px);min-height:620px;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden}.welcome:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,#ffb347aa 0 2%,transparent 12%),radial-gradient(circle at 18% 78%,#ff9d2e88 0 3%,transparent 15%),radial-gradient(circle at 92% 72%,#f5c58266 0 2%,transparent 10%),linear-gradient(135deg,#10091f 0%,#24103b 42%,#0a1028 100%);opacity:.82}.welcome-inner{position:relative;width:min(740px,100%)}h1{font-family:"Cinzel Decorative",serif;font-size:clamp(28px,4vw,46px);letter-spacing:-.045em;text-align:center;margin:0 0 7px;color:#ffe0a4;text-shadow:0 0 10px #f08b3d88,0 2px 0 #6e2d3a}.lead{text-align:center;color:var(--muted);margin:0 0 28px}.orbital{width:120px;height:120px;margin:0 auto 22px;position:relative;border:1px solid #929ab255;border-radius:50%}.orbital:before,.orbital:after{content:"";position:absolute;border:1px solid #929ab255;border-radius:50%;inset:14px -24px;transform:rotate(45deg)}.orbital:after{inset:28px -40px;transform:rotate(-35deg)}.orbital b{position:absolute;inset:42px;border-radius:50%;background:#ffd891;box-shadow:0 0 25px #ffcf77}.orbital i{position:absolute;width:12px;height:12px;left:10px;top:53px;border-radius:50%;background:#77aeea;animation:spin 8s linear infinite;transform-origin:50px 7px}@keyframes spin{to{transform:rotate(360deg)}}
.composer{background:#111a2aee;border:1px solid #3a465a;border-radius:17px;padding:14px;box-shadow:0 15px 55px #0005}.composer textarea{width:100%;height:72px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);padding:5px}.composerbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.composerbar button{border:1px solid var(--line);border-radius:8px;background:#1b2639;padding:8px 11px;color:var(--text)}.composerbar .send{background:var(--gold);color:#211b17;border-color:var(--gold)}.hints{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}.hint{border:1px solid var(--line);background:#111a2a99;padding:7px 10px;border-radius:20px;color:#cad2df;font-size:12px}
.chatframe{height:calc(100vh - 58px);min-height:620px;width:100%;border:0;background:#090e1b}.toolview{padding:28px;max-width:1050px;margin:auto}.toolhead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.toolhead h2{margin:3px 0;font-size:26px}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}.card label{display:block;margin:12px 0 6px;font-weight:650}.card input,.card select,.card textarea{width:100%;padding:10px;background:#0a111f;color:var(--text);border:1px solid #465166;border-radius:8px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolresult{white-space:pre-wrap;overflow-wrap:anywhere;max-height:40vh;overflow:auto}
.drawer{position:fixed;z-index:5;inset:0;background:#0009;display:none;justify-content:flex-end}.drawer.open{display:flex}.drawerpanel{height:100%;width:min(470px,100%);background:#101827;border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column}.drawerhead{display:flex;justify-content:space-between;align-items:center}.drawerhead h2{margin:0}.drawer input{width:100%;padding:11px;background:#0a111f;color:var(--text);border:1px solid #465166;border-radius:9px;margin:15px 0}.catalog{overflow:auto}.catalog-item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.catalog-item h3{margin:0;font-size:14px}.catalog-item p{margin:3px 0 0;color:var(--muted);font-size:12px}.catalog-item button{min-width:74px}.notice{color:var(--muted);font-size:12px}
@media(max-width:760px){.app{grid-template-columns:64px 1fr}.side{padding:12px 7px;align-items:center}.brand{font-size:0;padding:6px}.sidebtn{justify-content:center;font-size:0;padding:11px}.sidebtn span{font-size:17px}.smallhead,.plugin-btn,.bottom{display:none}.cards{grid-template-columns:1fr}.top{padding:0 12px}.top .subtle{display:none}.welcome{padding:20px 14px}.toolview{padding:18px 12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px auto 4px;max-width:560px;text-align:left}.plan{display:flex;flex-direction:column;gap:5px;padding:14px;border:1px solid var(--line);background:#111a2aee;border-radius:12px;color:var(--muted)}.plan strong{color:var(--text);font-size:1.35rem}.plan b{color:var(--gold)}.plan a{color:#c7dcff;margin-top:4px}.plan.featured{border-color:var(--gold);box-shadow:0 0 0 1px #f5c58233}.plan-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}@media(max-width:600px){.plans{grid-template-columns:1fr}}</style></head><body><div class="app">
