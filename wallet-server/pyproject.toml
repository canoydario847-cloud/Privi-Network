[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privi-wallet"
version = "0.1.0"
description = "Privi Wallet: sign up, create a PRIVI wallet on Base, send and receive, with a hash-linked activity record and Quantum Ledger status."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dario Canoy" }]
requires-python = ">=3.11"
dependencies = ["starlette>=0.37", "uvicorn>=0.30", "cryptography>=42", "eth-account>=0.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
privi-wallet = "privi_wallet.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/privi_wallet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
