#cloud-config
# Privi VALueless STAGING host only. Replace with a real SSH public key.
# Never commit production validator keys. This never starts consensus or issues PRVI.
package_update: true
package_upgrade: true
ssh_pwauth: false
disable_root: true
users:
  - default
  - name: priviadmin
    gecos: Privi staging operator
    groups: [sudo]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - REPLACE_WITH_REAL_SSH_ED25519_PUBLIC_KEY
packages:
  - ca-certificates
  - chrony
  - fail2ban
  - jq
  - ufw
  - unattended-upgrades
write_files:
  - path: /etc/motd
    permissions: '0644'
    content: |
      PRVI financial mainnet is NOT DEPLOYED on this host.
      Valueless multi-host staging only. No prod signing keys.
# Do NOT enable firewall before verifying SSH. Do NOT expose RPC or metrics.
final_message: 'Privi valueless staging base image complete; no blockchain started.'
