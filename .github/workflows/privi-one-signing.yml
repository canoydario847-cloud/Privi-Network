name: Privi ONE public-key receipt tests

on:
  push:
    paths:
      - 'privi-one/signed_receipt.py'
      - 'privi-one/signing_demo.py'
      - 'privi-one/signed_checkpoint.py'
      - 'privi-one/checkpoint_cli.py'
      - 'privi-one/test_signed_checkpoint.py'
      - 'privi-one/receipt_journal.py'
      - 'privi-one/test_signed_receipt.py'
      - '.github/workflows/privi-one-signing.yml'
  pull_request:
    paths:
      - 'privi-one/signed_receipt.py'
      - 'privi-one/signing_demo.py'
      - 'privi-one/signed_checkpoint.py'
      - 'privi-one/checkpoint_cli.py'
      - 'privi-one/test_signed_checkpoint.py'
      - 'privi-one/receipt_journal.py'
      - 'privi-one/test_signed_receipt.py'
      - '.github/workflows/privi-one-signing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maintained cryptographic implementation
        run: python -m pip install 'cryptography>=43,<47'
      - name: Test sandbox Ed25519 signatures and pinned-key verification
        run: |
          python -m unittest discover -s privi-one -p 'test_signed_receipt.py' -v
          python -m unittest discover -s privi-one -p 'test_signed_checkpoint.py' -v
