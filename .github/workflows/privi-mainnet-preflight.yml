name: Privi mainnet candidate build (no deployment)

on:
  pull_request:
    paths:
      - "production-network/mainnet/**"
      - ".github/workflows/privi-mainnet-preflight.yml"
  workflow_dispatch:

concurrency:
  group: privi-mainnet-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned crypto signature verification dependency
        run: python3 -m pip install 'cryptography==46.0.4'
      - name: Run PRVI configuration and genesis validation unit tests
        run: python3 -m unittest discover -s production-network/mainnet -p "test_*.py" -v
      - name: Confirm incomplete mainnet manifest is rejected
        run: |
          set -eu
          if python3 production-network/mainnet/mainnet_preflight.py \
              --manifest production-network/mainnet/manifest.example.json; then
            echo "ERROR: Incomplete Privi mainnet manifest incorrectly passed." >&2
            exit 1
          fi
          echo "PASS: mainnet release remains BLOCKED."
      - name: Confirm source overlay refuses unselected production chain IDs
        run: |
          set -eu
          if python3 production-network/mainnet/privi_source_overlay.py \
              --upstream /tmp/not-a-checkout \
              --output /tmp/privi-unreviewed.patch; then
            echo "ERROR: Source patcher ignored incomplete config" >&2
            exit 1
          fi
          echo "PASS: default unapproved chain IDs BLOCKED."

      - name: Prove production deployment gate refuses unsigned template inputs
        run: |
          set -euo pipefail
          echo '{"chain_id":"local-privi-seven-4221","app_state":{}}' > /tmp/privi-incomplete-genesis.json
          echo '{"allocations":[]}' > /tmp/privi-incomplete-allocations.json
          printf 'NOT_A_PRODUCTION_BINARY' > /tmp/privi-incomplete-bin
          if python3 production-network/mainnet/deployment_readiness.py \
              --manifest production-network/mainnet/manifest.example.json \
              --config production-network/mainnet/privi_chain_config.json \
              --genesis /tmp/privi-incomplete-genesis.json \
              --allocations /tmp/privi-incomplete-allocations.json \
              --binary /tmp/privi-incomplete-bin \
              --release production-network/mainnet/operator-kit/release.template.json \
              --roster production-network/mainnet/operator_roster.template.json \
              --attestations production-network/mainnet/operator-kit/attestations.template.json; then
            echo "ERROR: financial mainnet gate incorrectly accepted empty documents" >&2
            exit 1
          fi
          echo "PASS: financial mainnet deployment remains BLOCKED until independently reviewed inputs exist."

  upstream-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
      - name: Check out exact known upstream Cosmos EVM code
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.7.3 https://github.com/cosmos/evm.git /tmp/cosmos-evm
          actual="$(git -C /tmp/cosmos-evm rev-parse HEAD)"
          test "$actual" = "c3ae9067a7eadcdea55a5192226916deb44c71c4"
      - name: Create ephemeral CI-only non-production chain IDs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("production-network/mainnet/privi_chain_config.json")
          c=json.loads(p.read_text())
          c["network"]["cosmos_chain_id"]="privi-ci-nonproduction-999"
          c["network"]["evm_chain_id"]=999991
          Path("/tmp/privi-ci-config.json").write_text(json.dumps(c))
          PY
      - name: Generate, verify, and apply UNREVIEWED source overlay in CI only
        run: |
          set -euo pipefail
          python3 production-network/mainnet/privi_source_overlay.py \
              --upstream /tmp/cosmos-evm \
              --config /tmp/privi-ci-config.json \
              --output /tmp/privi-unreviewed.patch
          git -C /tmp/cosmos-evm apply --check /tmp/privi-unreviewed.patch
          git -C /tmp/cosmos-evm apply /tmp/privi-unreviewed.patch
          gofmt -w /tmp/cosmos-evm/evmd/app.go \
              /tmp/cosmos-evm/evmd/genesis.go \
              /tmp/cosmos-evm/evmd/config/bech32.go \
              /tmp/cosmos-evm/evmd/cmd/evmd/cmd/root.go
      - name: Assert PRVI InitChain supply equal-cap and EndBlock upper-cap guards exist
        run: |
          set -euo pipefail
          app=/tmp/cosmos-evm/evmd/app.go
          grep -Fq 'Privi genesis native supply must equal exactly 1 billion PRVI' "$app"
          grep -Fq 'PRVI supply above fixed maximum' "$app"
          grep -Fq 'priviNoMintAppModule' "$app"
          echo "Verified all three independent native-supply code guards."
      - name: Compile patched Cosmos EVM candidate node (never deploy)
        working-directory: /tmp/cosmos-evm/evmd
        run: |
          set -euo pipefail
          go build -o /tmp/privi-ci-nonproduction ./cmd/evmd
          test -s /tmp/privi-ci-nonproduction
          echo "Candidate Go binary compiled for CI. It is NOT mainnet approved and will NOT be uploaded or deployed."
      - name: Initialize synthetic unfunded PRVI node and verify real genesis defaults
        run: |
          set -euo pipefail
          python3 production-network/mainnet/ci_runtime_init.py \
            --binary /tmp/privi-ci-nonproduction \
            --report /tmp/privi-ci-init-report.json
          test -s /tmp/privi-ci-init-report.json
          echo "Actual candidate initialization verified; throwaway genesis and keys destroyed."
      - name: Verify real InitChain refuses empty PRVI supply (ephemeral, local, no deployment)
        run: |
          set -euo pipefail
          python3 production-network/mainnet/ci_init_chain_cap_negative.py \
            --binary /tmp/privi-ci-nonproduction
          echo "PASS: real candidate startup rejects zero-funds genesis with exact PRVI InitChain cap error."
      - name: Rehearse exactly 1 billion synthetic PRVI funded genesis and first local block
        run: |
          set -euo pipefail
          python3 production-network/mainnet/ci_funded_genesis_positive.py \
            --binary /tmp/privi-ci-nonproduction
          echo "PASS: CI-only 1B genesis bank/state and first local block; no financial mainnet."
      - name: Produce hash-only nonproduction build receipt
        run: |
          set -euo pipefail
          python3 production-network/mainnet/candidate_build_report.py \
            --binary /tmp/privi-ci-nonproduction \
            --patch /tmp/privi-unreviewed.patch \
            --config /tmp/privi-ci-config.json \
            --output /tmp/privi-ci-build-receipt.json
          cat /tmp/privi-ci-build-receipt.json
          {
            echo "### Privi nonproduction candidate compilation"
            echo "Compiled pinned Cosmos EVM source with PRVI-denom review overlay."
            echo "Binary SHA-256 (candidate only):"
            python3 -c 'import json; print(json.load(open("/tmp/privi-ci-build-receipt.json"))["binary_sha256"])'
            echo ""
            echo "NOT a production release, funded genesis, audited binary, or chain activation."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish build receipt only (NO binary, keys, genesis or coins)
        uses: actions/upload-artifact@v4
        with:
          name: privi-nonproduction-build-receipt
          path: /tmp/privi-ci-build-receipt.json
          retention-days: 7
          if-no-files-found: error

# READ-ONLY workflow: no wallet keys, contracts, node launch, token creation, deployment or release publication.
