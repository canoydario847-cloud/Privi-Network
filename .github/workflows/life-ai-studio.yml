name: LIFE AI Studio tests
on:
  push:
    paths:
      - 'life-ai-studio/**'
      - '.github/workflows/life-ai-studio.yml'
  pull_request:
    paths:
      - 'life-ai-studio/**'
      - '.github/workflows/life-ai-studio.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-ai-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: life-ai-studio/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
