name: Privi unsigned custom-node binary (TEST ONLY)

on:
  pull_request:
    paths:
      - 'production-network/mainnet/**'
      - '.github/workflows/privi-unsigned-binary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privi-unsigned-test-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-test-binary:
    name: Compile and package unsigned PRVI candidate for valueless review
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up reviewed Go compiler
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache: false
      - name: Fetch exact pinned upstream SDK application
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.7.3 https://github.com/cosmos/evm.git "$RUNNER_TEMP/.upstream-capbuild"
          test "$(git -C "$RUNNER_TEMP/.upstream-capbuild" rev-parse HEAD)" = "c3ae9067a7eadcdea55a5192226916deb44c71c4"
          test "$(git -C "$RUNNER_TEMP/.upstream-capbuild" describe --tags --exact-match)" = "v0.7.3"
      - name: Inject native PRVI candidate guards into disposable checkout
        run: |
          set -euo pipefail
          python3 production-network/mainnet/custom-app/apply_prvi_cap.py \
            --upstream "$RUNNER_TEMP/.upstream-capbuild" --source-repo "$GITHUB_WORKSPACE"
          python3 production-network/mainnet/custom-app/patch_pinned_erc20_mutations.py \
            --upstream "$RUNNER_TEMP/.upstream-capbuild"
          gofmt -w "$RUNNER_TEMP/.upstream-capbuild/evmd/app.go" "$RUNNER_TEMP/.upstream-capbuild/evmd/prvicap/"*.go \
            "$RUNNER_TEMP/.upstream-capbuild/x/erc20/keeper/params.go" \
            "$RUNNER_TEMP/.upstream-capbuild/x/erc20/keeper/token_pairs.go"
          git -C "$RUNNER_TEMP/.upstream-capbuild" diff --check
      - name: Compile and independently compare twin local builds
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/.upstream-capbuild/evmd"
          GOTOOLCHAIN=local go test -mod=mod -p 2 -run '^$' -timeout 20m . ./prvicap
          mkdir -p "$RUNNER_TEMP/privi-unsigned-test-binary"
          GOTOOLCHAIN=local go build -mod=mod -p 2 -trimpath -buildvcs=false \
            -o "$RUNNER_TEMP/privi-unsigned-test-binary/privi-evmd-UNSIGNED-TEST-ONLY" ./cmd/evmd
          GOTOOLCHAIN=local go build -mod=mod -p 2 -trimpath -buildvcs=false \
            -o "$RUNNER_TEMP/privi-evmd-independent-twin" ./cmd/evmd
          cmp "$RUNNER_TEMP/privi-unsigned-test-binary/privi-evmd-UNSIGNED-TEST-ONLY" \
            "$RUNNER_TEMP/privi-evmd-independent-twin"
      - name: Prove custom InitChain rejects upstream/default and unsafe genesis
        run: |
          set -euo pipefail
          PROBE="$RUNNER_TEMP/.upstream-capbuild/evmd/cmd/privi-cap-genesis-probe"
          mkdir -p "$PROBE"
          cp production-network/mainnet/custom-app/privi_cap_genesis_probe_main.go "$PROBE/main.go"
          gofmt -w "$PROBE/main.go"
          cd "$RUNNER_TEMP/.upstream-capbuild/evmd"
          GOTOOLCHAIN=local go run -mod=mod -p 2 ./cmd/privi-cap-genesis-probe
      - name: Prove custom InitChain accepts only disposable cap-compliant genesis
        run: |
          set -euo pipefail
          PROBE="$RUNNER_TEMP/.upstream-capbuild/evmd/cmd/privi-cap-genesis-positive-probe"
          mkdir -p "$PROBE"
          cp production-network/mainnet/custom-app/privi_cap_genesis_positive_probe_main.go "$PROBE/main.go"
          gofmt -w "$PROBE/main.go"
          cd "$RUNNER_TEMP/.upstream-capbuild/evmd"
          GOTOOLCHAIN=local go build -mod=mod -p 2 -o "$RUNNER_TEMP/privi-positive-genesis-valueless" ./cmd/privi-cap-genesis-positive-probe
          "$RUNNER_TEMP/privi-positive-genesis-valueless"
          PRIVI_ERC20_NEGATIVE_PROBE=permissionless "$RUNNER_TEMP/privi-positive-genesis-valueless"
          PRIVI_ERC20_NEGATIVE_PROBE=native-pair "$RUNNER_TEMP/privi-positive-genesis-valueless"
      - name: Create traceable nonfinancial artifact
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/privi-unsigned-test-binary"
          cat > "$OUT/READ-ME-FIRST.txt" <<'EOF'
          UNSIGNED PRVI CUSTOM NODE CANDIDATE — VALELESS RESEARCH ONLY
          NOT A PRODUCTION RELEASE. DO NOT RUN WITH A FINANCIAL GENESIS.
          NO PRODUCTION SIGNING KEYS, GENESIS, ACCOUNTS, COINS, OR LIQUIDITY ARE INCLUDED.
          The binary has only a same-host twin-build comparison, not an independent
          multi-host reproducible build, audited mint/balance paths, or chain-ID registry approval.
          Distribution of these bytes does not authorize mainnet activation.
          The known supply-neutral unauthorized-account mutation gap remains unresolved.
          EOF
          printf 'privi_source_commit=%s\nupstream_cosmos_evm_tag=%s\nupstream_cosmos_evm_commit=%s\n' \
            "$GITHUB_SHA" "v0.7.3" "c3ae9067a7eadcdea55a5192226916deb44c71c4" > "$OUT/BUILD-PROVENANCE.txt"
          go version -m "$OUT/privi-evmd-UNSIGNED-TEST-ONLY" > "$OUT/GO-BUILD-INFO.txt"
          (cd "$OUT" && sha256sum privi-evmd-UNSIGNED-TEST-ONLY GO-BUILD-INFO.txt BUILD-PROVENANCE.txt READ-ME-FIRST.txt > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)
      - name: Upload short-lived unsigned review artifact (never a financial release)
        uses: actions/upload-artifact@v4
        with:
          name: privi-unsigned-custom-node-TEST-ONLY
          path: ${{ runner.temp }}/privi-unsigned-test-binary/
          if-no-files-found: error
          retention-days: 3
