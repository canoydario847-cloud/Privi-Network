name: Privi Continuity vault tests
on:
  pull_request:
    paths: ['jose-site/continuity.html', 'jose-site/tests/continuity-vault.test.mjs', '.github/workflows/continuity-vault.yml']
  push:
    branches: [main]
    paths: ['jose-site/continuity.html', 'jose-site/tests/continuity-vault.test.mjs', '.github/workflows/continuity-vault.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node jose-site/tests/continuity-vault.test.mjs
