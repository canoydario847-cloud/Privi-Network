name: Privi Wall authorization security tests
on:
  pull_request:
    paths:
      - 'security/privi-wall/**'
      - '.github/workflows/privi-wall-auth.yml'
  push:
    branches:
      - 'security/privi-wall-*'
    paths:
      - 'security/privi-wall/**'
      - '.github/workflows/privi-wall-auth.yml'
permissions:
  contents: read
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Node version
        run: node --version
      - name: Check authorization syntax
        run: node --check security/privi-wall/agent_call_auth.cjs
      - name: Run isolated Privi Wall security regression tests
        run: node --test security/privi-wall/test_bounded_replay_guard.cjs security/privi-wall/test_agent_call_auth.cjs security/privi-wall/test_source_integrity.cjs security/privi-wall/test_websocket_origin_guard.cjs security/privi-wall/test_websocket_upgrade_gate.cjs security/privi-wall/test_active_session_guard.cjs security/privi-wall/test_async_active_session_guard.cjs security/privi-wall/test_tenant_action_guard.cjs security/privi-wall/test_tenant_policy_deadline.cjs security/privi-wall/test_atomic_replay_admission.cjs security/privi-wall/test_signed_agent_admission_gate.cjs security/privi-wall/test_signed_claims_binding.cjs security/privi-wall/test_authorized_execution_gate.cjs security/privi-wall/test_receipt_transcript.cjs security/privi-wall/test_verify_execution_receipt.cjs security/privi-wall/test_verify_tenant_bound_receipt.cjs security/privi-wall/test_verify_fresh_tenant_receipt.cjs security/privi-wall/test_verify_once_tenant_receipt.cjs security/privi-wall/test_redis_replay_admission.cjs security/privi-wall/test_redis_replay_ttl_cap.cjs security/privi-wall/test_validate_replay_policy.cjs
