name: Privi Wall authorization security tests
on:
  pull_request:
    paths:
      - 'security/privi-wall/**'
      - '.github/workflows/privi-wall-auth.yml'
  push:
    branches:
      - 'security/privi-wall-*'
    paths:
      - 'security/privi-wall/**'
      - '.github/workflows/privi-wall-auth.yml'
permissions:
  contents: read
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Node version
        run: node --version
      - name: Check syntax of every Privi Wall JavaScript module
        run: |
          find security/privi-wall -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -r -n 1 node --check
      - name: Run all Privi Wall security regression tests (fail if none found)
        shell: bash
        run: |
          mapfile -d '' tests < <(find security/privi-wall -type f -name 'test_*.cjs' -print0 | sort -z)
          if (( ${#tests[@]} == 0 )); then
            echo 'ERROR: no Privi Wall regression tests discovered' >&2
            exit 1
          fi
          printf 'Discovered %d security test files\\n' "${#tests[@]}"
          node --test "${tests[@]}"
