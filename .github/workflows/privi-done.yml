name: Privi DONE offline deployment and code origin tests
on:
  push:
    paths:
      - 'privi-done/**'
      - '.github/workflows/privi-done.yml'
  pull_request:
    paths:
      - 'privi-done/**'
      - '.github/workflows/privi-done.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-done:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate outcome and code provenance
        run: python -m unittest discover -s privi-done -p 'test_*.py' -v
      - name: Exercise runnable offline commands
        run: |
          python privi-done/cli.py origin --source privi-done/cli.py
          python privi-done/cli.py deployment --intent privi-done/examples/intent.json --evidence privi-done/examples/evidence.json

  observe-public-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe fixed public Privi ONE health endpoint (noncertifying)
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          path = Path("privi-done/public_health.py")
          spec = importlib.util.spec_from_file_location("privi_done_public_health", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.inspect_privi_one_health()
          print(json.dumps(result, sort_keys=True))
          # A completed job never implies health succeeded: expose the actual observation.
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Privi ONE public endpoint observation\\n")
              f.write("Endpoint: \`https://privi-one-demo.onrender.com/health\`\\n\\n")
              f.write("Reported result: \`" + result["result"] + "\`\\n\\n")
              f.write("**Not** a deployed-commit check, paid-entitlement check, "
                      "customer-acceptance report, or mainnet validation.\\n")
          PY

  verify-deployed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Check separate Render preview running commit and health
        env:
          EXPECTED_DEPLOY_COMMIT: 7d4299ab717e7cbd13344b1950127f574836d3dc
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from urllib.request import HTTPRedirectHandler, build_opener
          base = "https://privi-done-version-preview.onrender.com"
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def get(path):
              req = urllib.request.Request(base + path, method="GET",
                                           headers={"Accept": "application/json"})
              with build_opener(NoRedirect()).open(req, timeout=80) as response:
                  if response.status != 200 or response.geturl() != base + path:
                      raise RuntimeError("unexpected preview HTTP response")
                  raw = response.read(4097)
                  if len(raw) > 4096:
                      raise RuntimeError("oversized preview response")
                  return json.loads(raw)
          try:
              health = get("/health")
              version = get("/api/version")
              healthy = health.get("ok") is True and health.get("service") == "privi-one-demo" and health.get("mode") == "PRELAUNCH_SIMULATION"
              expected = os.environ["EXPECTED_DEPLOY_COMMIT"]
              same = version.get("self_reported_commit") == expected and version.get("version_source") == "RENDER_GIT_COMMIT_ENV" and version.get("independently_attested") is False
              result = {"health": "observed" if healthy else "failed",
                        "reported_sha": version.get("self_reported_commit"),
                        "expected_sha": expected,
                        "version_self_report_matches": same,
                        "independently_attested": False,
                        "customer_outcome_certified": False}
              print(json.dumps(result, sort_keys=True))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
                  handle.write("## Separate free Render preview observation\\n")
                  handle.write("Health: " + result["health"] + "\\n\\n")
                  handle.write("Version self-report matches pinned Render deploy SHA: " + str(same) + "\\n\\n")
                  handle.write("No independent execution attestation, billing or customer acceptance.\\n")
              if not healthy or not same:
                  raise SystemExit(1)
          except (urllib.error.URLError, TimeoutError, OSError, ValueError, KeyError) as e:
              print("Preview unavailable / unverified: " + str(e))
              raise SystemExit(1)
          PY
