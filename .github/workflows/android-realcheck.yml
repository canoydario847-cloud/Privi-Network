name: Privi RealCheck Android app

# Builds the Privi RealCheck app bundle (.aab) for Google Play.
# Signed only if the owner has added REALCHECK_KEYSTORE_B64 and REALCHECK_KEYSTORE_PASSWORD secrets; otherwise unsigned.
on:
  push:
    branches: [main]
    paths: ["android-realcheck/**", ".github/workflows/android-realcheck.yml"]
  pull_request:
    paths: ["android-realcheck/**", ".github/workflows/android-realcheck.yml"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Check app identity
        run: |
          grep -q 'applicationId = "us.priviflow.realcheck"' android-realcheck/app/build.gradle.kts
          grep -q 'https://privi-quantum.onrender.com/real' android-realcheck/app/src/main/res/values/strings.xml
      - name: Build release bundle
        working-directory: android-realcheck
        run: gradle --no-daemon bundleRelease
      - name: Sign with the upload key (only if secrets are set)
        env:
          KS_B64: ${{ secrets.REALCHECK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.REALCHECK_KEYSTORE_PASSWORD }}
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
            android-realcheck/app/build/outputs/bundle/release/app-release.aab upload
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: privi-realcheck-${{ github.run_number }}
          path: android-realcheck/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
