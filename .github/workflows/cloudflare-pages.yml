# Publishes the Privi websites (sites/*) to Cloudflare Pages, one Pages project per site.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with: Account / Cloudflare Pages / Edit  and  Zone / DNS / Edit (zone privishine.info)
#                          (the secret saved as CLOUDFARE_API is used when CLOUDFLARE_API_TOKEN is not set)
#   CLOUDFLARE_ACCOUNT_ID  optional; defaults to the Privi account below (an account ID is not a secret)
#
# Every push to main that touches sites/ redeploys the sites to privi-<site>.pages.dev.
# The custom domains (www.privishine.info, gov.privishine.info, ...) are attached only when the workflow
# is run by hand with "Attach privishine.info domains" ticked. Only those hostnames are changed; the apex
# privishine.info (Railway app), explorer.privishine.info, MX and TXT records are never touched.
name: Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["sites/**", ".github/workflows/cloudflare-pages.yml", ".github/scripts/cloudflare-domains.sh"]
  workflow_dispatch:
    inputs:
      attach_domains:
        description: "Attach privishine.info domains (www, gov, chainflow, ... point at Cloudflare Pages)"
        type: boolean
        default: false

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [home, fortress, passport, kya, mandates, gov, chainflow, developers, live, hub, guard]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '13303bee4c6d300e54bfc490400e8126' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping Cloudflare deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean up the API token
        if: steps.secrets.outputs.ok == 'true'
        run: |
          # The saved secret may carry spaces, a line break or a pasted "Authorization: Bearer ..." command.
          tok=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | head -n1 || true)
          if [ -z "$tok" ]; then echo "::error::The Cloudflare token secret does not contain a token"; exit 1; fi
          echo "::add-mask::$tok"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: "20"
      - name: Create the Pages project (first run only)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          out=$(npx --yes wrangler@3.114.0 pages project create "privi-${{ matrix.site }}" --production-branch=main 2>&1) && echo "$out" || {
            echo "$out"; echo "$out" | grep -qiE "already exists|8000002" || { echo "::error::could not create the Pages project"; exit 1; }; }
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@3.114.0 pages deploy "sites/${{ matrix.site }}" --project-name="privi-${{ matrix.site }}" --branch=main --commit-dirty=true

  domains:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.attach_domains
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '13303bee4c6d300e54bfc490400e8126' }}
      ZONE_NAME: privishine.info
    steps:
      - uses: actions/checkout@v4
      - name: Clean up the API token
        run: |
          tok=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | head -n1 || true)
          if [ -z "$tok" ]; then echo "::error::The Cloudflare token secret does not contain a token"; exit 1; fi
          echo "::add-mask::$tok"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
      - name: Attach custom domains and point DNS at Pages
        run: bash .github/scripts/cloudflare-domains.sh
