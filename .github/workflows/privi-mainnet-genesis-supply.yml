name: Privi mainnet offline genesis supply audit
on:
  pull_request:
    paths:
      - 'mainnet/audit_genesis_supply.cjs'
      - 'mainnet/test_audit_genesis_supply.cjs'
      - 'mainnet/test_audit_genesis_supply_edge_cases.cjs'
      - 'mainnet/audit_genesis_allocations.cjs'
      - 'mainnet/test_audit_genesis_allocations.cjs'
      - '.github/workflows/privi-mainnet-genesis-supply.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout untrusted branch for offline tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Node runtime
        run: node --version
      - name: Validate auditor and test syntax
        run: |
          node --check mainnet/audit_genesis_supply.cjs
          node --check mainnet/test_audit_genesis_supply.cjs
          node --check mainnet/test_audit_genesis_supply_edge_cases.cjs
          node --check mainnet/audit_genesis_allocations.cjs
          node --check mainnet/test_audit_genesis_allocations.cjs
      - name: Run genesis supply and allocation regression tests
        run: node --test mainnet/test_audit_genesis_supply.cjs mainnet/test_audit_genesis_supply_edge_cases.cjs mainnet/test_audit_genesis_allocations.cjs
