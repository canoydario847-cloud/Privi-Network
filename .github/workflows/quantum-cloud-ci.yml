name: Privi Quantum Cloud CI
on:
  pull_request:
    paths:
      - 'quantum-server/**'
      - '.github/workflows/quantum-cloud-ci.yml'
  push:
    paths:
      - 'quantum-server/**'
jobs:
  test-cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quantum simulator and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test local quantum cloud
        run: python -m pytest -q tests/test_cloud.py
