name: Privi public outage reachability (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/privi-outage-reachability.yml'
      - 'call-server/tools/latency_probe.py'
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check public Privi service /health from GitHub runner
        run: |
          python3 call-server/tools/latency_probe.py \
            --region github-actions-unverified \
            --requests 1 --workers 1 --timeout 12 \
            --url https://privi-ledger.onrender.com/health \
            --url https://privi-verify.onrender.com/health \
            --url https://privi-anchor.onrender.com/health \
            --url https://privi-quantum.onrender.com/health \
            --url https://privi-call.onrender.com/health \
            --url https://privi-discovery.onrender.com/health \
            --output /tmp/privi-public-health.json
      - name: Diagnose public website DNS and HTTPS (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, socket, urllib.request, urllib.error, urllib.parse
          urls = [
            "https://priviflow.us/",
            "https://www.privishine.info/",
            "https://hub.privishine.info/",
            "https://developers.privishine.info/",
            "https://guard.privishine.info/",
            "https://chainflow.privishine.info/",
            "https://privi-hub.onrender.com/",
            "https://privi-world.onrender.com/world/",
          ]
          for url in urls:
              host = urllib.parse.urlparse(url).hostname
              result = {"url": url}
              try:
                  result["dns"] = sorted({x[4][0] for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})[:6]
              except Exception as exc:
                  result["dns_error"] = type(exc).__name__
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"PriviIncidentProbe/1.0"}),timeout=12) as resp:
                      result["http_status"] = resp.status
                      result["final_url"] = resp.url
              except urllib.error.HTTPError as exc:
                  result["http_status"] = exc.code
              except Exception as exc:
                  result["http_error"] = type(exc).__name__
              print(json.dumps(result), flush=True)
          PY
      - name: Publish sanitized diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privi-public-health
          path: /tmp/privi-public-health.json
          if-no-files-found: ignore
          retention-days: 7
