name: AI spend estimator tests
on:
  pull_request:
    paths:
      - 'sites/home/ai-spend/**'
      - '.github/workflows/ai-spend-tests.yml'
  push:
    paths:
      - 'sites/home/ai-spend/**'
      - '.github/workflows/ai-spend-tests.yml'
permissions:
  contents: read
jobs:
  estimator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sites/home/ai-spend/audit.js
      - run: node sites/home/ai-spend/audit.test.cjs
