name: Publish MCP server to MCP Registry

# Publishes each server's server.json whenever it changes on main.
# Bump "version" in server.json for each new listing; the registry rejects duplicate versions.
on:
  push:
    branches: [main]
    paths: ["mcp-server/server.json", "ledger-server/server.json", "anchor-server/server.json", "quantum-server/server.json", "call-server/server.json", ".github/workflows/mcp-registry-publish.yml"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry, no secrets needed
      contents: read
    strategy:
      fail-fast: false
      matrix:
        server: ["mcp-server", "ledger-server", "anchor-server", "quantum-server", "call-server"]
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      # Publishing the same version twice is forbidden by the registry.
      # A 200 means this exact version is already listed; 404 means publish.
      # Any other HTTP/network response is a hard failure, never a silent pass.
      - name: Check existing version
        id: registry_check
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys
          import urllib.error, urllib.parse, urllib.request
          with open("server.json", encoding="utf-8") as stream:
              record = json.load(stream)
          name = urllib.parse.quote(record["name"], safe="")
          version = urllib.parse.quote(record["version"], safe="")
          url = f"https://registry.modelcontextprotocol.io/v0/servers/{name}/versions/{version}"
          import time
          found = None
          for attempt in range(1, 5):          # the registry sometimes times out on lookups
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url, headers={"Accept": "application/json"}),
                      timeout=60,
                  ) as response:
                      if response.status != 200:
                          raise RuntimeError(f"Unexpected registry status {response.status}")
                      data = json.load(response)
                  listed = data.get("server", data)
                  if listed.get("name") != record["name"] or listed.get("version") != record["version"]:
                      raise RuntimeError("Registry returned mismatched name/version; not skipping")
                  found = True
                  break
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      found = False
                      break
                  if error.code < 500 or attempt == 4:
                      raise
              except (TimeoutError, urllib.error.URLError, ConnectionError) as error:
                  if attempt == 4:
                      raise
                  print(f"registry lookup failed ({error}); retry {attempt}/3 in {15 * attempt}s")
              time.sleep(15 * attempt)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"already_published={str(found).lower()}\n")
          print(f"Official MCP Registry: {'already published' if found else 'new version to publish'}")
          PY

      - name: Authenticate to MCP Registry
        if: steps.registry_check.outputs.already_published == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish new version
        if: steps.registry_check.outputs.already_published == 'false'
        run: ./mcp-publisher publish server.json
