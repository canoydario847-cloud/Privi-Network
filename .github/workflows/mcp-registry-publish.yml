name: Publish MCP server to MCP Registry

# Publishes each server's server.json whenever it changes on main.
# Bump "version" in server.json for each new listing; the registry rejects duplicate versions.
on:
  push:
    branches: [main]
    paths: ["mcp-server/server.json", "ledger-server/server.json", "anchor-server/server.json", "quantum-server/server.json", "call-server/server.json", ".github/workflows/mcp-registry-publish.yml"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry, no secrets needed
      contents: read
    strategy:
      fail-fast: false
      matrix:
        server: ["mcp-server", "ledger-server", "anchor-server", "quantum-server", "call-server"]
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      # Publishing an already-listed version fails; that is expected for the unchanged server.
      - name: Publish
        run: ./mcp-publisher publish || echo "::warning::not published (version may already be listed)"
