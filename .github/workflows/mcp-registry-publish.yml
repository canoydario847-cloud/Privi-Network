name: Publish MCP server to MCP Registry

# Publishes each server's server.json whenever it changes on main.
# Bump "version" in server.json for each new listing; the registry rejects duplicate versions.
on:
  push:
    branches: [main]
    paths: ["mcp-server/server.json", "ledger-server/server.json", "anchor-server/server.json", "quantum-server/server.json", "call-server/server.json", "privi-agent-survival/server.json", ".github/workflows/mcp-registry-publish.yml"]
  workflow_dispatch:

# Avoid overlapping releases racing to publish the same immutable version.
concurrency:
  group: mcp-registry-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry, no secrets needed
      contents: read
      statuses: write # make official Registry proof queryable on the commit
    strategy:
      fail-fast: false
      matrix:
        server: ["mcp-server", "ledger-server", "anchor-server", "quantum-server", "call-server", "privi-agent-survival"]
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@v5

      # Report Registry-specific progress independently of unrelated Railway deploys.
      - name: Mark Privi Registry verification in progress
        if: matrix.server == 'privi-agent-survival'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" \
            -f state=pending \
            -f context="Privi MCP Registry / Agent Survival" \
            -f description="MCP Registry verification in progress" \
            -f target_url="$RUN_URL"

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json


      # Avoid advertising broken hosted metadata and auth behavior to registries.
      - name: Verify live Privi remote MCP handshake
        if: matrix.server == 'privi-agent-survival'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://privi-ai-21-gateway.onrender.com"

          def call(path, payload=None):
              headers = {"Accept": "application/json, text/event-stream"}
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(base + path, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=40) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return json.load(response)

          def rpc(method, params, identifier):
              return call("/mcp", {
                  "jsonrpc": "2.0", "id": identifier,
                  "method": method, "params": params
              })

          for attempt in range(1, 6):
              try:
                  health = call("/health")
                  if health.get("status") != "ok":
                      raise RuntimeError("Gateway health is not ok")
                  if health.get("mcp_endpoint") != "/mcp":
                      raise RuntimeError("Gateway MCP route mismatch")

                  # Compare source registry metadata against the actual served card.
                  with open("server.json", encoding="utf-8") as f:
                      expected = json.load(f)
                  card = call("/.well-known/mcp/server-card.json")
                  if card.get("serverInfo", {}).get("version") != expected["version"]:
                      raise RuntimeError("Hosted MCP server-card version mismatches Registry manifest")
                  if card.get("authentication", {}).get("required") is not True:
                      raise RuntimeError("Gateway incorrectly advertises optional auth")
                  live_manifest = call("/mcp-server.json")
                  if live_manifest.get("name") != expected["name"]:
                      raise RuntimeError("Hosted MCP server name mismatches Registry manifest")
                  if live_manifest.get("version") != expected["version"]:
                      raise RuntimeError("Hosted MCP version mismatches Registry manifest")
                  if not any(
                      remote.get("url") == base + "/mcp"
                      for remote in live_manifest.get("remotes", [])
                  ):
                      raise RuntimeError("Hosted MCP manifest lacks the live remote endpoint")

                  init = rpc("initialize", {
                      "protocolVersion": "2025-11-25",
                      "capabilities": {},
                      "clientInfo": {"name": "privi-registry-smoke", "version": "1"}
                  }, 1)
                  if init.get("result", {}).get("protocolVersion") != "2025-11-25":
                      raise RuntimeError("MCP initialize failed")
                  if init.get("result", {}).get("serverInfo", {}).get("version") != expected["version"]:
                      raise RuntimeError("Live MCP initialization version mismatches Registry manifest")

                  catalog = rpc("tools/list", {}, 2)
                  tools = catalog.get("result", {}).get("tools", [])
                  if len(tools) < 83:
                      raise RuntimeError(f"Expected >=83 MCP tools, got {len(tools)}")

                  # Probe only an unauthenticated call; must not spend credits.
                  denied = rpc("tools/call", {
                      "name": "privi_time_now", "arguments": {}
                  }, 3)
                  result = denied.get("result", {})
                  if result.get("isError") is not True:
                      raise RuntimeError("Unauthenticated execution was not denied")
                  code = result.get("structuredContent", {}).get("error")
                  if code not in {"api_key_required", "paid_checkout_not_ready"}:
                      raise RuntimeError(f"Unexpected unauthenticated result: {code}")

                  summary = (
                      "### Privi hosted MCP gateway verified\n\n"
                      f"Health, manifest/card v{expected['version']}, MCP handshake, {len(tools)} tools, "
                      "and denied anonymous execution passed.\n"
                  )
                  print(summary)
                  with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                      output.write(summary)
                  break
              except (ValueError, KeyError, urllib.error.URLError, TimeoutError, RuntimeError) as error:
                  print(f"Readiness probe {attempt}/5 failed: {error}")
                  if attempt == 5:
                      raise
                  time.sleep(attempt * 10)
          PY

      # Publishing the same version twice is forbidden by the registry.
      # A 200 means this exact version is already listed; 404 means publish.
      # Any other HTTP/network response is a hard failure, never a silent pass.
      - name: Check existing version
        id: registry_check
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys
          import urllib.error, urllib.parse, urllib.request
          with open("server.json", encoding="utf-8") as stream:
              record = json.load(stream)
          name = urllib.parse.quote(record["name"], safe="")
          version = urllib.parse.quote(record["version"], safe="")
          url = f"https://registry.modelcontextprotocol.io/v0.1/servers/{name}/versions/{version}"
          import time
          found = None
          for attempt in range(1, 5):          # the registry sometimes times out on lookups
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url, headers={"Accept": "application/json"}),
                      timeout=60,
                  ) as response:
                      if response.status != 200:
                          raise RuntimeError(f"Unexpected registry status {response.status}")
                      data = json.load(response)
                  listed = data.get("server", data)
                  if listed.get("name") != record["name"] or listed.get("version") != record["version"]:
                      raise RuntimeError("Registry returned mismatched name/version; not skipping")
                  found = True
                  break
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      found = False
                      break
                  if error.code < 500 or attempt == 4:
                      raise
              except (TimeoutError, urllib.error.URLError, ConnectionError) as error:
                  if attempt == 4:
                      raise
                  print(f"registry lookup failed ({error}); retry {attempt}/3 in {15 * attempt}s")
              time.sleep(15 * attempt)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"already_published={str(found).lower()}\n")
          print(f"Official MCP Registry: {'already published' if found else 'new version to publish'}")
          PY

      - name: Authenticate to MCP Registry
        if: steps.registry_check.outputs.already_published == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish new version
        if: steps.registry_check.outputs.already_published == 'false'
        run: ./mcp-publisher publish server.json


      # Publishing is not considered verified until the version is returned by
      # the official public Registry API (allow time for indexing consistency).
      - name: Confirm official Registry record
        id: registry_confirm
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          with open("server.json", encoding="utf-8") as f:
              entry = json.load(f)

          name = urllib.parse.quote(entry["name"], safe="")
          version = urllib.parse.quote(entry["version"], safe="")
          url = f"https://registry.modelcontextprotocol.io/v0.1/servers/{name}/versions/{version}"
          retryable = {404, 429, 500, 502, 503, 504}
          for attempt in range(1, 11):
              try:
                  request = urllib.request.Request(url, headers={"Accept": "application/json"})
                  with urllib.request.urlopen(request, timeout=40) as response:
                      data = json.load(response)
                  record = data.get("server", data)
                  if record.get("name") != entry["name"] or record.get("version") != entry["version"]:
                      raise RuntimeError("Registry returned mismatched server name or version")
                  message = f"Verified official MCP Registry publication: {entry['name']} v{entry['version']} — {url}"
                  print(message)
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"verified_registry_url={url}\n")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write(f"### Official MCP Registry verified\n\n{message}\n")
                  break
              except urllib.error.HTTPError as error:
                  if error.code not in retryable:
                      raise
                  print(f"Registry not ready: HTTP {error.code}, attempt {attempt}/10")
              except (urllib.error.URLError, TimeoutError) as error:
                  print(f"Registry connection pending: {error}, attempt {attempt}/10")
              if attempt == 10:
                  raise RuntimeError(f"Official Registry did not confirm {entry['name']} v{entry['version']}: {url}")
              time.sleep(12)
          PY

      # Publish a commit status only after checking exact version with the public Registry API.
      - name: Report verified Privi Registry publication to GitHub
        if: matrix.server == 'privi-agent-survival' && steps.registry_confirm.outputs.verified_registry_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_URL: ${{ steps.registry_confirm.outputs.verified_registry_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" \
            -f state=success \
            -f context="Privi MCP Registry / Agent Survival" \
            -f description="Official Registry confirms Agent Survival version" \
            -f target_url="$VERIFIED_URL"

      # Failure status is diagnostic; report failures but never mask the original job error.
      - name: Mark Privi Registry verification failed
        if: failure() && matrix.server == 'privi-agent-survival'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$COMMIT_SHA" \
            -f state=failure \
            -f context="Privi MCP Registry / Agent Survival" \
            -f description="Registry job failed; inspect workflow logs" \
            -f target_url="$RUN_URL"
