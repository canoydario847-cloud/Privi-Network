name: Privi Agent Proof security regressions
on:
  pull_request:
    paths:
      - 'ledger-server/src/privi_ledger/agent_proof.py'
      - 'ledger-server/src/privi_ledger/config.py'
      - 'ledger-server/src/privi_ledger/server.py'
      - 'ledger-server/tests/test_agent_proof.py'
      - 'skills/privi-agent-proof/**'
      - '.github/workflows/privi-agent-proof.yml'
  push:
    branches:
      - 'feature/agent-proof-*'
    paths:
      - 'ledger-server/**'
      - 'skills/privi-agent-proof/**'
      - '.github/workflows/privi-agent-proof.yml'
permissions:
  contents: read
jobs:
  signed-proof-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install signature verifier
        run: python -m pip install 'cryptography>=42'
      - name: Check agent-proof syntax
        run: |
          python -m py_compile ledger-server/src/privi_ledger/agent_proof.py ledger-server/src/privi_ledger/config.py ledger-server/src/privi_ledger/server.py ledger-server/tests/test_agent_proof.py
      - name: Run signed policy and execution verification regressions
        env:
          PYTHONPATH: ledger-server/src
        run: python -m unittest discover -s ledger-server/tests -p 'test_agent_proof.py' -v
