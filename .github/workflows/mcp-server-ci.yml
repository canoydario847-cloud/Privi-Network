name: MCP servers CI

on:
  push:
    branches: [main]
    paths: ["mcp-server/**", "ledger-server/**", "anchor-server/**", "call-server/**", ".github/workflows/mcp-server-ci.yml"]
  pull_request:
    paths: ["mcp-server/**", "ledger-server/**", "anchor-server/**", "call-server/**", ".github/workflows/mcp-server-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
        server: ["mcp-server", "ledger-server", "anchor-server", "call-server", "quantum-server"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
