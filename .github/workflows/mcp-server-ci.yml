name: MCP servers CI

on:
  push:
    branches: [main]
    paths: ["mcp-server/**", "ledger-server/**", "anchor-server/**", "call-server/**", "quantum-server/**", ".github/workflows/mcp-server-ci.yml"]
  pull_request:
    paths: ["mcp-server/**", "ledger-server/**", "anchor-server/**", "call-server/**", "quantum-server/**", ".github/workflows/mcp-server-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
        server: ["mcp-server", "ledger-server", "anchor-server", "call-server", "quantum-server"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE --tb=line 2>&1 | tee pytest.log
      - name: Show test failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) |^E +|\.py:[0-9]+: " pytest.log | head -40 | sed 's/^/::error::/' || true
