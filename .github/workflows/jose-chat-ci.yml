name: Hey Jose chat CI
on:
  pull_request:
    paths:
      - 'jose-backend/**'
      - 'jose-site/**'
      - '.github/workflows/jose-chat-ci.yml'
  push:
    branches: [main]
    paths:
      - 'jose-backend/**'
      - 'jose-site/**'
      - '.github/workflows/jose-chat-ci.yml'
permissions:
  contents: read
jobs:
  backend-syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Jose backend and site syntax
        run: |
          node --check jose-backend/src/server.js
          node --check jose-backend/src/jose-powers.js
          node --check jose-backend/src/privi-devnet.js
          node --check jose-backend/test/privi-devnet-live-smoke.mjs
          node --check jose-backend/src/chat-modes.js
          node --check jose-backend/src/chat-attachments.js
          node --check jose-backend/public/chat-extras.js
          node --check jose-site/ais.js
          node --check jose-site/web3-core.mjs
          node --check jose-site/web3-studio.mjs
      - name: Validate inline chat browser scripts
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('jose-backend/public/chat.html', 'utf8');
          const scripts = html.split('<script>').slice(1).map(chunk => chunk.split('</script>')[0]).filter(Boolean);
          if (scripts.length === 0) throw new Error('Hey Jose chat scripts missing');
          for (const code of scripts) new vm.Script(code);
          NODE
      - name: Run Jose backend tests
        run: npm test
        working-directory: jose-backend
      - name: Probe the real Privi Devnet RPC and latest block (diagnostic only)
        continue-on-error: true
        run: node jose-backend/test/privi-devnet-live-smoke.mjs
      - name: Install isolated Solidity compiler for contract validation
        run: npm install --no-save --ignore-scripts --no-audit --no-fund solc@0.8.28 @openzeppelin/contracts@5.4.0
      - name: Compile all Web3 contract templates
        run: node jose-backend/test/compile-web3-templates.mjs

