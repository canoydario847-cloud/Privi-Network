name: Privi-only IoT developer-gated ledger (nonfinancial)

on:
  pull_request:
    paths:
      - 'production-network/iot/**'
      - 'production-network/mainnet/pop_mainnet_guard.py'
      - 'production-network/mainnet/test_pop_mainnet_guard.py'
      - 'production-network/mainnet/privi_pop_iot_development.template.json'
      - 'production-network/mainnet/PRIVI_POP_RELEASE_GATE.md'
      - 'production-network/mainnet/pop_candidate/**'
      - '.github/workflows/privi-iot-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-iot:
    name: Test Privi developer access, foreign chain denial and local AI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify device signatures, developer access and Privi-only RPC pinning
        run: node --test production-network/iot/gateway/test_core.cjs
      - name: Verify Privi Intent Capsules with signed rules (NO FINANCIAL EXECUTION)
        run: |
          set -euo pipefail
          TEMP_ETHERS="$RUNNER_TEMP/privi-intent-ethers"
          mkdir -p "$TEMP_ETHERS"
          npm install --prefix "$TEMP_ETHERS" --no-save --ignore-scripts --no-audit --no-fund --silent ethers@6.15.0
          PRIVI_CAPSULE_ETHERS_PATH="$TEMP_ETHERS/node_modules/ethers" \
            node --test production-network/iot/intents/test_capsule.cjs
      - name: Verify local AI labels and non-minted PRVI estimates
        run: python3 -m unittest discover -s production-network/iot/tests -p 'test_*.py' -v
      - name: Fail closed on non-PoP consensus, foreign ledgers, missing IoT controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s production-network/mainnet -p 'test_pop_mainnet_guard.py' -v
          python3 production-network/mainnet/pop_mainnet_guard.py \
            --development --manifest production-network/mainnet/privi_pop_iot_development.template.json
          set +e
          python3 production-network/mainnet/pop_mainnet_guard.py \
            --manifest production-network/mainnet/privi_pop_iot_development.template.json
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then echo "PoP financial mainnet gate must remain NO-GO" >&2; exit 1; fi
      - name: Exercise Point of Position validator research prototype (NOT CONSENSUS)
        run: node --test production-network/mainnet/pop_candidate/test_engine.cjs
      - name: Compile Privi-native gated contract with pinned compiler
        run: |
          set -euo pipefail
          TEMP_SOLC="$RUNNER_TEMP/privi-iot-solc"
          mkdir -p "$TEMP_SOLC"
          npm install --prefix "$TEMP_SOLC" --no-save --ignore-scripts --no-audit --no-fund --silent solc@0.8.26
          PRIVI_SOLC_PATH="$TEMP_SOLC/node_modules/solc" node - <<'NODE'
          const fs = require("node:fs");
          const solc = require(process.env.PRIVI_SOLC_PATH);
          if (!solc.version().startsWith("0.8.26+")) throw Error("Unexpected Solidity version");
          const name = "PriviIoTLedger.sol";
          const source = fs.readFileSync("production-network/iot/contracts/"+name, "utf8");
          if (/\b(?:mint|transferFrom|delegatecall|selfdestruct)\s*\(/.test(source)) {
            throw Error("Unsafe token/smart contract behavior in IoT registry");
          }
          const input = {language:"Solidity",sources:{[name]:{content:source}},
            settings:{optimizer:{enabled:true,runs:200},viaIR:true,evmVersion:"paris",
              outputSelection:{"*":{"*":["abi","evm.bytecode.object"]}}}};
          const out = JSON.parse(solc.compile(JSON.stringify(input)));
          const errors = (out.errors||[]).filter(e=>e.severity==="error");
          if(errors.length)throw Error(errors.map(x=>x.formattedMessage).join("\n"));
          const contract = out.contracts?.[name]?.PriviIoTLedger;
          if(!contract?.evm?.bytecode?.object)throw Error("No Privi IoT contract bytecode");
          const names = contract.abi.map(x=>x.name).filter(Boolean);
          for (const required of ["DeveloperRegistered","DeveloperEnabled",
               "registerDeveloper","setDeveloperEnabled","developers",
               "proposeCompanyRegistration","acceptCompanyRegistration",
               "rejectCompanyRegistration","cancelCompanyRegistration",
               "pendingCompanyAdministrators",
               "setCompanyEnabled","setCompanyGateway","companyGatewayEpoch",
               "proposeCompanyAdministratorTransfer","cancelCompanyAdministratorTransfer",
               "acceptCompanyAdministratorTransfer","pendingCompanySuccessors",
               "companies","companyGateways",
               "nextPositionSequence","popLastPosition","usedPoPStamp",
               "enrollDevice","recordEvent","IoTRecorded"]) {
            if(!names.includes(required))throw Error("Privi developer gate ABI missing "+required);
          }
          console.log("Privi IoT developer-gated Solidity compiled; no production deployment.");
          NODE
      - name: Retain explicit financial launch NO-GO
        run: |
          echo "Tests do NOT start or operate mainnet; no real PRVI payouts, mint, rewards or other-chain transfers."
