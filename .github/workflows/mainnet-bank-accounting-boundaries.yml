name: Mainnet bank accounting boundary tests
on:
  pull_request:
    paths:
      - 'mainnet/audit_bank_supply.cjs'
      - 'mainnet/audit_supply_manifest.cjs'
      - 'mainnet/test_bank_accounting_boundaries.cjs'
      - '.github/workflows/mainnet-bank-accounting-boundaries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bank-accounting-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline bank accounting boundary tests
        run: node --test mainnet/test_bank_accounting_boundaries.cjs
