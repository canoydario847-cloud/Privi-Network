name: Privi Android app

# Builds the Privi app bundle (.aab) for Google Play, unsigned.
# The bundle is signed afterwards with Privi's upload key, which is kept off GitHub.
on:
  push:
    branches: [main]
    paths: ["android-app/**", "sites/home/.well-known/assetlinks.json", "sites/home/manifest.webmanifest", "sites/home/privacy.html", ".github/workflows/android-app.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Verify Android and web origin metadata (offline only)
        run: python3 android-app/scripts/play_preflight.py
      - name: Test Android publishing preflight
        run: python3 -m unittest discover -s android-app/tests -p 'test_*.py' -v
      - name: Build release bundle
        working-directory: android-app
        run: gradle --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: privi-android-unsigned-${{ github.run_number }}
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Attach the bundle to a draft release (for signing off GitHub)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/bundle/release/app-release.aab privi-unsigned-${{ github.run_number }}.aab
          gh release create "android-build-${{ github.run_number }}" privi-unsigned-${{ github.run_number }}.aab \
            --draft --target "${{ github.sha }}" --title "Privi Android build ${{ github.run_number }} (unsigned)" \
            --notes "Unsigned release bundle. Sign with the Privi upload key before uploading to Google Play."
