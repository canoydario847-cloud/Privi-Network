name: Privi Android app

# Builds the Privi app bundle (.aab) for Google Play, unsigned.
# The bundle is signed afterwards with Privi's upload key, which is kept off GitHub.
on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android-app.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build release bundle
        working-directory: android-app
        run: gradle --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: privi-android-unsigned-${{ github.run_number }}
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
