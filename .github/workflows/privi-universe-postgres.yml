name: Privi Universe disposable PostgreSQL integration
on:
  push:
    paths:
      - 'privi-universe/postgres_sessions.py'
      - 'privi-universe/postgres_session_schema.sql'
      - 'privi-universe/session_storage_config.py'
      - 'privi-universe/integration_pg_sessions.py'
      - '.github/workflows/privi-universe-postgres.yml'
  pull_request:
    paths:
      - 'privi-universe/postgres_sessions.py'
      - 'privi-universe/postgres_session_schema.sql'
      - 'privi-universe/session_storage_config.py'
      - 'privi-universe/integration_pg_sessions.py'
      - '.github/workflows/privi-universe-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: privi_ci
          POSTGRES_PASSWORD: privi_ci_only_test_password
          POSTGRES_DB: privi_universe_ci_sessions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privi_ci -d privi_universe_ci_sessions"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_DSN: postgresql://privi_ci:privi_ci_only_test_password@127.0.0.1:5432/privi_universe_ci_sessions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL test driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Execute real database integration tests (must not skip)
        run: python -m unittest discover -s privi-universe -p 'integration_pg_sessions.py' -v
