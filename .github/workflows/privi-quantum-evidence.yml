name: Privi Quantum Evidence Lab independent Qiskit verification
on:
  push:
    paths:
      - 'quantum-server/src/privi_quantum/evidence_lab.py'
      - 'quantum-server/tests/test_evidence_lab.py'
      - 'quantum-server/tests/test_evidence_qiskit.py'
      - 'quantum-server/src/privi_quantum/hardware_evidence.py'
      - 'quantum-server/tests/test_hardware_evidence.py'
      - 'quantum-server/src/privi_quantum/qaoa.py'
      - 'quantum-server/src/privi_quantum/hardware.py'
      - '.github/workflows/privi-quantum-evidence.yml'
  pull_request:
    paths:
      - 'quantum-server/**'
      - '.github/workflows/privi-quantum-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies and independent Qiskit reference
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'pytest>=8' 'cryptography>=50' 'qiskit>=1.3,<3'
      - name: Run exact distribution equivalence and Qiskit oracle
        env:
          PYTHONPATH: quantum-server/src
        run: python -m pytest quantum-server/tests/test_evidence_lab.py quantum-server/tests/test_evidence_qiskit.py quantum-server/tests/test_hardware_evidence.py -v
