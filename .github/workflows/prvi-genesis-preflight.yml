name: PRVI genesis preflight
on:
  pull_request:
    paths:
      - 'production-network/ops/prvi_genesis_preflight.py'
      - 'production-network/ops/test_prvi_genesis_preflight.py'
      - '.github/workflows/prvi-genesis-preflight.yml'
  push:
    paths:
      - 'production-network/ops/prvi_genesis_preflight.py'
      - 'production-network/ops/test_prvi_genesis_preflight.py'
      - '.github/workflows/prvi-genesis-preflight.yml'
permissions:
  contents: read
jobs:
  offline-genesis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline genesis preflight unit tests
        working-directory: production-network/ops
        run: |
          pwd
          git ls-files --error-unmatch production-network/ops/prvi_genesis_preflight.py || true
          if [ ! -f privi_genesis_preflight.py ]; then
            git show HEAD:production-network/ops/prvi_genesis_preflight.py > privi_genesis_preflight.py
          fi
          ls -la privi_genesis_preflight.py test_prvi_genesis_preflight.py
          python3 -m unittest -v test_prvi_genesis_preflight.py
