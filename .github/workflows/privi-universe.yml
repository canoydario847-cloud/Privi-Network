name: Privi Universe portal tests
on:
  push:
    paths:
      - 'privi-universe/**'
      - '.github/workflows/privi-universe.yml'
  pull_request:
    paths:
      - 'privi-universe/**'
      - '.github/workflows/privi-universe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Portal integrity and safe-link checks
        run: python -m unittest discover -s privi-universe -p 'test_*.py' -v
