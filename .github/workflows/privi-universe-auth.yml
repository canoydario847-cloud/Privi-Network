name: Privi Universe OAuth and entitlement tests
on:
  push:
    paths:
      - 'privi-universe/account_access.py'
      - 'privi-universe/test_account_access.py'
      - 'privi-universe/oauth_flow.py'
      - 'privi-universe/test_oauth_flow.py'
      - 'privi-universe/login_protocol.py'
      - '.github/workflows/privi-universe-auth.yml'
  pull_request:
    paths:
      - 'privi-universe/account_access.py'
      - 'privi-universe/test_account_access.py'
      - '.github/workflows/privi-universe-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jwt-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maintained signature verification dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Test signed accounts, misconfiguration and paid entitlement rejection
        run: |
          python -m unittest discover -s privi-universe -p 'test_account_access.py' -v
          python -m unittest discover -s privi-universe -p 'test_oauth_flow.py' -v
