name: Privi Gate authentication security tests

on:
  push:
    paths:
      - 'gate-sdk/python/**'
      - '.github/workflows/privi-gate-security-tests.yml'
  pull_request:
    paths:
      - 'gate-sdk/python/**'
      - '.github/workflows/privi-gate-security-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify Privi Gate authentication, path exemptions and denial
        run: python -m pytest gate-sdk/python/tests/test_gate.py -q
