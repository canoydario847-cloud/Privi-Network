name: PRVI Genesis Amount Safety
on:
  pull_request:
    paths:
      - 'production-network/ops/genesis_supply_audit.py'
      - 'production-network/ops/test_genesis_supply_audit.py'
      - 'production-network/ops/test_genesis_supply_canonical.py'
      - 'production-network/ops/test_genesis_supply_duplicate_keys.py'
      - '.github/workflows/prvi-genesis-amount-safety.yml'
  push:
    branches: [main]
    paths:
      - 'production-network/ops/genesis_supply_audit.py'
      - 'production-network/ops/test_genesis_supply_audit.py'
      - 'production-network/ops/test_genesis_supply_canonical.py'
      - 'production-network/ops/test_genesis_supply_duplicate_keys.py'
      - '.github/workflows/prvi-genesis-amount-safety.yml'
permissions:
  contents: read
jobs:
  genesis-amount-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile production-network/ops/genesis_supply_audit.py production-network/ops/test_genesis_supply_audit.py production-network/ops/test_genesis_supply_canonical.py production-network/ops/test_genesis_supply_duplicate_keys.py
      - name: Offline genesis bank accounting tests
        run: python -m unittest discover -s production-network/ops -p 'test_genesis_supply*.py' -v
