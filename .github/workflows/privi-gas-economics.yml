name: Privi gas revenue accounting research (NO MAINNET)

on:
  pull_request:
    paths:
      - 'production-network/economics/**'
      - 'production-network/testnet/evm_receipt_audit.py'
      - 'production-network/testnet/test_evm_receipt_audit.py'
      - 'production-network/testnet/evm_smoke.py'
      - '.github/workflows/privi-gas-economics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  developer-fee-economics:
    name: Test nonfinancial PRVI gas policy and fee-revenue integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run gas charged vs treasury revenue accounting checks
        run: node --test production-network/economics/test_gas_market.cjs production-network/economics/test_receipt_crosscheck.cjs production-network/economics/test_agent_call_meter.cjs
      - name: Verify type-aware signed gas limits in read-only dev receipt auditor
        run: python3 -m unittest discover -s production-network/testnet -p 'test_evm_receipt_audit.py' -v
      - name: Explicitly prevent any financial launch in fee-policy tests
        run: |
          set -euo pipefail
          echo 'Privi economics are advisory/research only; no financial genesis, PRVI mint, payment or mainnet deployment.'
