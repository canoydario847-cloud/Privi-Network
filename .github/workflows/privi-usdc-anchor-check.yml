name: USDC Anchor guardrail tests

on:
  pull_request:
    paths:
      - 'anchor-server/usdc-paymaster/**'
      - '.github/workflows/privi-usdc-anchor-check.yml'
  push:
    branches: [main]
    paths:
      - 'anchor-server/usdc-paymaster/**'
      - '.github/workflows/privi-usdc-anchor-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned verifier dependencies
        working-directory: anchor-server/usdc-paymaster
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check anchor and verifier syntax
        working-directory: anchor-server/usdc-paymaster
        run: npm run check
      - name: Run read-only proof and no-funds guardrails
        working-directory: anchor-server/usdc-paymaster
        run: npm test
