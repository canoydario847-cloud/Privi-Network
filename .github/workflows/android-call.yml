name: Privi Call Android app

# Builds the Privi Call app bundle (.aab) for Google Play.
# Signed only if the owner has added CALL_KEYSTORE_B64 and CALL_KEYSTORE_PASSWORD secrets; otherwise unsigned.
on:
  push:
    branches: [main]
    paths: ["android-call/**", ".github/workflows/android-call.yml"]
  pull_request:
    paths: ["android-call/**", ".github/workflows/android-call.yml"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Check app identity
        run: |
          grep -q 'applicationId = "us.priviflow.call"' android-call/app/build.gradle.kts
          grep -q 'https://privi-call.onrender.com/app/' android-call/app/src/main/res/values/strings.xml
      - name: Build release bundle
        working-directory: android-call
        run: gradle --no-daemon bundleRelease
      - name: Sign with the upload key (only if secrets are set)
        env:
          KS_B64: ${{ secrets.CALL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.CALL_KEYSTORE_PASSWORD }}
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
            android-call/app/build/outputs/bundle/release/app-release.aab upload
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: privi-call-${{ github.run_number }}
          path: android-call/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Save the bundle to branch aab/call-latest (so it can be signed off GitHub)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cp android-call/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/pub/privi-call-unsigned.aab"
          cd "$RUNNER_TEMP/pub" && git init -q && git config user.name "privi-build" && git config user.email "dariocanoy@priviflow.us"
          echo "run ${{ github.run_number }} commit ${{ github.sha }}" > BUILD.txt
          git add . && git commit -qm "Privi call unsigned bundle, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD:refs/heads/aab/call-latest
