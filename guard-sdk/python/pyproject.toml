[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privi-guard"
version = "0.1.0"
description = "Check what your AI agent reads (prompt injection) and sends (leaked secrets), with signed receipts. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Dario Canoy", email = "dariocanoy@priviflow.us" }]
keywords = ["ai-agents", "prompt-injection", "llm-security", "dlp", "mcp", "x402", "guardrails"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://privi-hub.onrender.com"
Source = "https://github.com/canoydario847-cloud/Privi-Network/tree/main/guard-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/privi_guard"]
