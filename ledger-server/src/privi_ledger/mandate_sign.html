<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privi Mandate</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#0b1f3a;--mut:#5b6472;--line:#e3e6eb;--ok:#1a7f37;--bad:#c62828;--acc:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#121b2d;--ink:#e6eaf0;--mut:#9aa4b2;--line:#25304a;--ok:#4ade80;--bad:#f87171;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:600px;margin:40px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 6px}.sub{color:var(--mut);margin:0 0 16px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}dt{color:var(--mut)}dd{margin:0;word-break:break-word}
.terms{white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line)}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 16px system-ui;cursor:pointer}
button.secondary{background:transparent;color:var(--bad);border:1px solid var(--bad)}button:disabled{opacity:.5;cursor:default}
#log{font-size:14px;color:var(--mut);margin-top:12px;white-space:pre-wrap}.ok{color:var(--ok)}.bad{color:var(--bad)}
</style></head><body><main>
<div class="card">
<h1>Spending mandate for an AI agent</h1>
<p class="sub">Read the terms. Signing is free, sends no transaction and moves no money. You can revoke at any time.</p>
<div id="summary">Loading…</div>
<div class="terms" id="terms"></div>
<button id="sign" hidden>Connect wallet and sign</button>
<button id="revoke" class="secondary" hidden>Revoke this mandate</button>
<div id="log"></div>
</div>
</main>
<script>
const id = location.pathname.split('/')[2];
const $ = s => document.getElementById(s);
const say = (t, c) => { $('log').textContent = t; $('log').className = c || ''; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M;
async function load() {
  const r = await fetch('/mandates/' + id);
  if (!r.ok) { $('summary').textContent = 'Mandate not found.'; return; }
  M = await r.json();
  const pay = Array.isArray(M.payees) ? M.payees.join(', ') : 'any payee';
  $('summary').innerHTML = `<dl>
    <dt>Status</dt><dd><span class="pill">${esc(M.status)}</span></dd>
    <dt>Agent</dt><dd>${esc(M.stream_id)} (${esc(M.org_id)})</dd>
    <dt>Budget</dt><dd>${esc(M.max_total_usdc)} USDC total · ${esc(M.max_per_payment_usdc)} per payment</dd>
    <dt>Spent</dt><dd>${esc(M.spent_usdc)} USDC (${esc(M.remaining_usdc)} left)</dd>
    <dt>Payees</dt><dd>${esc(pay)}</dd>
    <dt>Expires</dt><dd>${esc(M.expires_at)} UTC</dd>
    <dt>Signer</dt><dd>${esc(M.principal)}</dd></dl>`;
  $('terms').textContent = M.message;
  $('sign').hidden = M.status !== 'draft';
  $('revoke').hidden = M.status !== 'active';
}
async function wallet() {
  if (!window.ethereum) throw new Error('No browser wallet found. Open this page where MetaMask is installed.');
  const [a] = await window.ethereum.request({method: 'eth_requestAccounts'});
  if (a.toLowerCase() !== M.principal.toLowerCase()) throw new Error('Switch MetaMask to ' + M.principal + ' (connected: ' + a + ')');
  return a;
}
async function post(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: 'bad response'}));
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
$('sign').onclick = async () => {
  $('sign').disabled = true;
  try {
    const a = await wallet(); say('Please sign in your wallet…');
    const signature = await window.ethereum.request({method: 'personal_sign', params: [M.message, a]});
    await post('/mandates/' + id + '/activate', {signature});
    say('✓ Mandate active. The agent can now spend within these limits.', 'ok'); await load();
  } catch (e) { say('✗ ' + (e.message || e), 'bad'); } finally { $('sign').disabled = false; }
};
$('revoke').onclick = async () => {
  $('revoke').disabled = true;
  try {
    const a = await wallet(); say('Please sign the revocation in your wallet…');
    const signature = await window.ethereum.request({method: 'personal_sign', params: ['Revoke Privi Mandate ' + id, a]});
    await post('/mandates/' + id + '/revoke', {signature, reason: 'revoked by principal'});
    say('✓ Revoked. Any further payment under this mandate will be refused.', 'ok'); await load();
  } catch (e) { say('✗ ' + (e.message || e), 'bad'); } finally { $('revoke').disabled = false; }
};
load();
</script></body></html>
