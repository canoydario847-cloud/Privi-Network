<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privi Approval</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#0b1f3a;--mut:#5b6472;--line:#e3e6eb;--ok:#1a7f37;--bad:#c62828;--acc:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#121b2d;--ink:#e6eaf0;--mut:#9aa4b2;--line:#25304a;--ok:#4ade80;--bad:#f87171;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:600px;margin:40px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 6px}.sub{color:var(--mut);margin:0 0 16px}
.big{font-size:20px;font-weight:600;margin:10px 0}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}dt{color:var(--mut)}dd{margin:0;word-break:break-word}
.terms{white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line)}
.row{display:flex;gap:10px;margin-top:16px}
button{flex:1;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 16px system-ui;cursor:pointer}
button.deny{background:transparent;color:var(--bad);border:1px solid var(--bad)}button:disabled{opacity:.5;cursor:default}
#log{font-size:14px;color:var(--mut);margin-top:12px;white-space:pre-wrap}.ok{color:var(--ok)}.bad{color:var(--bad)}
</style></head><body><main>
<div class="card">
<h1>An AI agent is asking for your approval</h1>
<p class="sub">Read the request. Approving or denying is free: you sign a message with your wallet, no transaction is sent and no money moves.</p>
<div id="summary">Loading…</div>
<div class="terms" id="terms"></div>
<div class="row" id="btns" hidden><button id="approve">Approve</button><button id="deny" class="deny">Deny</button></div>
<div id="log"></div>
</div>
</main>
<script>
const id = location.pathname.split('/')[2];
const $ = s => document.getElementById(s);
const say = (t, c) => { $('log').textContent = t; $('log').className = c || ''; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let A;
async function load() {
  const r = await fetch('/approvals/' + id);
  if (!r.ok) { $('summary').textContent = 'Request not found.'; return; }
  A = await r.json();
  const money = A.amount_usdc && A.amount_usdc !== '0' && A.amount_usdc !== '0.00' ? `<dt>Amount</dt><dd>${esc(A.amount_usdc)} USDC to ${esc(A.payee || '')}</dd>` : '';
  $('summary').innerHTML = `<div class="big">${esc(A.action)}</div><dl>
    <dt>Status</dt><dd><span class="pill">${esc(A.status)}</span></dd>
    <dt>Agent</dt><dd>${esc(A.stream_id)} (${esc(A.org_id)})</dd>${money}
    ${A.reason ? `<dt>Why</dt><dd>${esc(A.reason)}</dd>` : ''}
    ${A.mandate_id ? `<dt>Mandate</dt><dd>${esc(A.mandate_id)}</dd>` : ''}
    <dt>Decider</dt><dd>${esc(A.approver)}</dd>
    <dt>Expires</dt><dd>${esc(A.expires_at)} UTC</dd></dl>`;
  $('terms').textContent = A.messages.approve;
  $('btns').hidden = A.status !== 'pending';
}
async function wallet() {
  if (!window.ethereum) throw new Error('No browser wallet found. Open this page where MetaMask is installed.');
  const [a] = await window.ethereum.request({method: 'eth_requestAccounts'});
  if (a.toLowerCase() !== A.approver.toLowerCase()) throw new Error('Switch your wallet to ' + A.approver + ' (connected: ' + a + ')');
  return a;
}
async function decide(decision) {
  $('approve').disabled = $('deny').disabled = true;
  try {
    const a = await wallet(); say('Please sign in your wallet…');
    const signature = await window.ethereum.request({method: 'personal_sign', params: [A.messages[decision], a]});
    const r = await fetch('/approvals/' + id + '/decide', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({decision, signature})});
    const j = await r.json().catch(() => ({error: 'bad response'}));
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    say(decision === 'approve' ? '✓ Approved. The agent can proceed (valid for 10 minutes).' : '✓ Denied. The agent was told no.', 'ok');
    await load();
  } catch (e) { say('✗ ' + (e.message || e), 'bad'); $('approve').disabled = $('deny').disabled = false; }
}
$('approve').onclick = () => decide('approve');
$('deny').onclick = () => decide('deny');
load();
</script></body></html>
