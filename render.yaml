# Render Blueprint for the Privi MCP servers (Ledger, Verify, Anchor, Quantum, Call).
# Apply once: dashboard.render.com -> New -> Blueprint -> canoydario847-cloud/Privi-Network.
# Render asks only for the values marked `sync: false`; every internal secret is generated
# and shared between the services automatically.
#
# The discovery hub (privi-discovery) and the Jose site/backend are managed outside this file.

envVarGroups:
  - name: privi-coinbase-cdp
    envVars:
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false

services:
  # ------------------------------------------------------------------ Privi Anchor
  - type: web
    name: privi-anchor
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./anchor-server/Dockerfile
    dockerContext: ./anchor-server
    buildFilter:
      paths: ["anchor-server/**"]
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: privi-anchor-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANCHOR_DB_PATH
        value: /data/anchor.db
      # Privi anchors on Base until the Privi chain mainnet launches.
      - key: ANCHOR_RPC_URL
        value: https://mainnet.base.org
      - key: ANCHOR_CHAIN_ID
        value: "8453"
      - key: ANCHOR_NETWORK_NAME
        value: Base (until the Privi chain mainnet launches)
      - key: ANCHOR_EXPLORER_TX_URL
        value: https://basescan.org/tx/
      - key: ANCHOR_MAX_TX_PER_DAY      # gas budget: ~500 Base txs/day is well under $1/day
        value: "500"
      - key: ANCHOR_RATE_PER_MIN
        value: "30"
      - key: ANCHOR_GENESIS
        value: "1"
      - key: ANCHOR_API_KEYS          # shared with Ledger and Verify below
        generateValue: true
      - key: ANCHOR_PRIVATE_KEY       # anchor wallet; needs a little ETH on Base (≈ $5 lasts weeks)
        sync: false

  # ------------------------------------------------------------------ Privi Ledger
  - type: web
    name: privi-ledger
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./ledger-server/Dockerfile
    dockerContext: ./ledger-server
    buildFilter:
      paths: ["ledger-server/**"]
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: privi-ledger-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PRIVI_PAYMENTS          # paid tools also accept the PRIVI token (price from the Privi swap desk)
        value: "1"
      - fromGroup: privi-coinbase-cdp
      - key: LEDGER_DB_PATH
        value: /data/ledger.db
      - key: LEDGER_PUBLIC_URL
        value: https://privi-ledger.onrender.com
      - key: LEDGER_NETWORK
        value: base
      - key: LEDGER_FACILITATOR_URL
        value: https://api.cdp.coinbase.com/platform/v2/x402
      - key: LEDGER_PAY_TO
        value: "0x1990589FD200E043b8C6FD9ec5956c61b3071048"
      - key: LEDGER_PRICE_AUDIT_STREAM
        value: "0.02"
      - key: LEDGER_ADMIN_KEY
        generateValue: true
      - key: LEDGER_ANCHOR_URL
        value: https://privi-anchor.onrender.com/mcp
      - key: LEDGER_ANCHOR_KEY
        fromService:
          name: privi-anchor
          type: web
          envVarKey: ANCHOR_API_KEYS
      - key: LEDGER_ANCHOR_INTERVAL
        value: "300"
      - key: LEDGER_BOOTSTRAP_ORG_NAME
        value: Privi World Co
      - key: LEDGER_BOOTSTRAP_ORG_KEY  # Privi World Co's org API key (read it in the Render dashboard)
        generateValue: true
      - key: LEDGER_IMPORT_FILE
        value: /app/seed/privi-world-co-build-2026-10-19.json
      - key: LEDGER_BOOTSTRAP_REPORT
        value: "1"
      - key: LEDGER_BOOTSTRAP_PASSPORT
        value: "1"

  # ------------------------------------------------------------------ Privi Verify
  - type: web
    name: privi-verify
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./mcp-server/Dockerfile
    dockerContext: ./mcp-server
    buildFilter:
      paths: ["mcp-server/**"]
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: privi-verify-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PRIVI_PAYMENTS          # paid tools also accept the PRIVI token (price from the Privi swap desk)
        value: "1"
      - fromGroup: privi-coinbase-cdp
      - key: PRIVI_DB_PATH
        value: /data/privi.db
      - key: PRIVI_PUBLIC_URL
        value: https://privi-verify.onrender.com
      - key: PRIVI_NETWORK
        value: base
      - key: PRIVI_FACILITATOR_URL
        value: https://api.cdp.coinbase.com/platform/v2/x402
      - key: PRIVI_PAY_TO
        value: "0x1990589FD200E043b8C6FD9ec5956c61b3071048"
      - key: PRIVI_WRITE_KEYS         # manufacturer write key (read it in the Render dashboard)
        generateValue: true
      - key: PRIVI_SEED_DEMO
        value: "1"
      - key: PRIVI_ANCHOR_URL
        value: https://privi-anchor.onrender.com/mcp
      - key: PRIVI_ANCHOR_KEY
        fromService:
          name: privi-anchor
          type: web
          envVarKey: ANCHOR_API_KEYS
      - key: PRIVI_ANCHOR_INTERVAL
        value: "300"

  # ------------------------------------------------------------------ Privi Quantum
  - type: web
    name: privi-quantum
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./quantum-server/Dockerfile
    dockerContext: ./quantum-server
    buildFilter:
      paths: ["quantum-server/**"]
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: privi-quantum-data        # keeps the post-quantum signing key and attestations
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: QUANTUM_DB_PATH
        value: /data/quantum.db
      - key: QUANTUM_PUBLIC_URL
        value: https://privi-quantum.onrender.com
      - key: QUANTUM_ANCHOR_URL
        value: https://privi-anchor.onrender.com/mcp
      - key: QUANTUM_ANCHOR_API_KEY
        fromService:
          name: privi-anchor
          type: web
          envVarKey: ANCHOR_API_KEYS
      - key: QUANTUM_ANCHOR_INTERVAL
        value: "300"
      - key: QUANTUM_RATE_PER_MIN
        value: "20"
      - key: HARDWARE_DAILY_BUDGET_USD    # paid quantum hardware is off at 0; set a daily cap to turn it on
        value: "0"
      - key: HARDWARE_PRICES              # JSON USD prices per backend, e.g. {"ionq:qpu.forte-1":{"per_task":0.3,"per_shot":0.08}}
        sync: false
      - key: IONQ_API_KEY                 # IonQ Quantum Cloud; the IonQ simulator target is free
        sync: false
      - key: IONQ_TARGETS
        value: simulator
      - key: IBM_QUANTUM_TOKEN            # optional: IBM Quantum (also set IBM_QUANTUM_BACKENDS, e.g. ibm_brisbane)
        sync: false
      - key: GITHUB_TOKEN                 # optional: higher GitHub limits for crypto inventory repo scans
        sync: false
      # x402 paid tools (v0.7): readiness package $5, crypto inventory $5, advantage receipt $0.25, hardware routing $1
      - fromGroup: privi-coinbase-cdp     # CDP_API_KEY_ID / CDP_API_KEY_SECRET for the Coinbase facilitator
      - key: QUANTUM_PAY_TO               # setting this turns payments on; leave it empty to keep every tool free
        value: "0x1990589FD200E043b8C6FD9ec5956c61b3071048"
      - key: QUANTUM_NETWORK
        value: base
      - key: QUANTUM_FACILITATOR_URL
        value: https://api.cdp.coinbase.com/platform/v2/x402
      - key: PRIVI_PAYMENTS               # paid tools also accept the PRIVI token
        value: "1"
      - key: QUANTUM_BENCHMARK_HOURS      # re-run the public benchmark suite (/benchmarks) this often
        value: "24"

  # ------------------------------------------------------------------ Privi Call
  - type: web
    name: privi-call
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./call-server/Dockerfile
    dockerContext: ./call-server
    buildFilter:
      paths: ["call-server/**"]
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: privi-call-data          # the call log, directory and call credits
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PRIVI_PAYMENTS          # paid tools also accept the PRIVI token (price from the Privi swap desk)
        value: "1"
      - fromGroup: privi-coinbase-cdp
      - key: CALL_DB_PATH
        value: /data/call.db
      - key: CALL_PUBLIC_URL
        value: https://privi-call.onrender.com
      - key: CALL_NETWORK
        value: base
      - key: CALL_PAY_TO
        value: "0x1990589FD200E043b8C6FD9ec5956c61b3071048"
      - key: CALL_PACK_PRICE_USD        # 1,000 routed calls; $0.001 a call
        value: "1.00"
      - key: CALL_FREE_PER_DAY
        value: "50"
      - key: CALL_ADMIN_KEY             # read leads at /admin/calls (value in the Render dashboard)
        generateValue: true
      - key: CALL_ANCHOR_URL
        value: https://privi-anchor.onrender.com/mcp
      - key: CALL_ANCHOR_API_KEY
        fromService:
          name: privi-anchor
          type: web
          envVarKey: ANCHOR_API_KEYS
      - key: CALL_ANCHOR_INTERVAL
        value: "300"
      - key: CALL_FORWARD_NUMBER        # "Dario" on the phone line rings this number
        value: "+13134138532"
      - key: TWILIO_AUTH_TOKEN          # Twilio console -> Account -> Auth token (turns on the phone line)
        sync: false
      - key: CALL_PHONE_NUMBER          # the Twilio number you buy, e.g. +18105550100
        sync: false
      - key: ANTHROPIC_API_KEY          # optional: answers questions the phone script does not cover
        sync: false

  # ------------------------------------------------------------------ Privi Wallet
  # Accounts and Privi-held PRIVI wallets on Base. Custodial wallets stay OFF until WALLET_CUSTODY is set to 1.
  - type: web
    name: privi-wallet
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./wallet-server/Dockerfile
    dockerContext: ./wallet-server
    buildFilter:
      paths: ["wallet-server/**"]
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: privi-wallet-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: WALLET_DB_PATH
        value: /data/wallet.db
      - key: WALLET_PUBLIC_URL
        value: https://privi-wallet.onrender.com
      - key: WALLET_CUSTODY             # 0 = sign up + watch-only wallets; 1 = Privi creates and holds wallet keys
        value: "0"
      - key: WALLET_MASTER_KEY          # 32+ random characters; encrypts every wallet key. KEEP A COPY OFFLINE:
        sync: false                     # if it is lost, every Privi-held wallet is lost with it.
      - key: WALLET_RPC_URL
        value: https://mainnet.base.org
      - key: WALLET_MAX_SEND_PRIVI_24H
        value: "100000"
      - key: WALLET_MAX_SEND_USDC_24H
        value: "500"
      - key: WALLET_MAX_SEND_ETH_24H
        value: "0.1"
      - key: WALLET_LEDGER_URL
        value: https://privi-ledger.onrender.com
