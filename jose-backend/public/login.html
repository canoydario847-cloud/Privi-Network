<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión — Jose</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Iniciar sesión</h1>
    <p class="lede">Entra para ver y conectar tus apps.</p>
    <form id="form">
      <label for="email">Correo</label>
      <input id="email" type="email" required />
      <label for="password">Contraseña</label>
      <input id="password" type="password" required />
      <button type="submit">Entrar</button>
      <p class="error" id="error"></p>
    </form>
    <p class="switch">¿No tienes cuenta? <a href="signup.html">Crea una</a></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const body = await res.json();
      if (res.ok) {
        window.location.href = params.get('next') || 'dashboard.html';
      } else {
        document.getElementById('error').textContent = body.error;
      }
    });
  </script>
</body>
</html>
