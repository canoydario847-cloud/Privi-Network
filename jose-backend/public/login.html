<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Hey Jose Luna Light 5.6</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Iniciar sesión</h1>
    <p class="lede">Sign in to Hey Jose Luna Light 5.6 and use your plugins.</p>
    <form id="form">
      <label for="email">Correo</label>
      <input id="email" type="email" required />
      <label for="password">Contraseña</label>
      <input id="password" type="password" required />
      <button type="submit">Sign in</button>
      <p class="error" id="error"></p>
    </form>
    <p class="switch">New here? <a href="signup.html">Create an account</a></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      let res;
      try { res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      } catch (error) { document.getElementById('error').textContent = 'The sign-in service is unavailable. Please try again.'; return; }
      const body = await res.json();
      if (res.ok) {
        const next = params.get('next') || 'dashboard.html';
        window.location.href = next.startsWith('/') && !next.startsWith('//') ? next : 'dashboard.html';
      } else {
        document.getElementById('error').textContent = body.error;
      }
    });
  </script>
</body>
</html>
