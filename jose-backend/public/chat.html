<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with Hey Jose</title><link rel="stylesheet" href="/style.css">
<style>main{max-width:760px;margin:2rem auto;padding:1rem}.conversation{min-height:240px;max-height:60vh;overflow:auto;border:1px solid #aaa;border-radius:14px;padding:16px;margin:16px 0}.entry{white-space:pre-wrap;margin:12px 0;padding:12px;border-radius:10px;background:#edf4f2;color:#182824}.entry.user{background:#dee9f7}.entry.error{background:#ffe6e6}form{display:flex;gap:8px}textarea{width:100%;min-height:70px;font:inherit;padding:12px}button{padding:10px 16px}#status{font-size:.9rem}</style></head>
<body><main><nav><a href="/dashboard.html">← My apps</a></nav><h1>Ask Hey Jose</h1><p>Ask in English, español, português or 中文. Answers require the AI provider to be configured by Privi.</p><p id="status" role="status">Checking AI availability…</p><div id="conversation" class="conversation" role="log" aria-live="polite"></div>
<form id="chat"><textarea id="message" maxlength="2000" placeholder="Ask a question…" required aria-label="Message for Jose"></textarea><button id="send" type="submit">Send</button></form>
<script>
const log=document.getElementById('conversation'),status=document.getElementById('status'),send=document.getElementById('send');
function entry(role,text){const el=document.createElement('div');el.className='entry '+role;el.textContent=(role==='user'?'You: ':role==='jose'?'Jose: ':'')+text;log.append(el);log.scrollTop=log.scrollHeight;}
fetch('/api/chat/status',{credentials:'same-origin'}).then(async r=>{if(r.status===401){location.href='/login.html?next=chat.html';return;}const d=await r.json();status.textContent=d.available?'Jose is ready for questions.':'AI provider not configured. Contact Privi support to enable answers.';}).catch(()=>status.textContent='Could not check the AI service.');
document.getElementById('chat').addEventListener('submit',async e=>{e.preventDefault();const field=document.getElementById('message'),message=field.value.trim();if(!message)return;entry('user',message);field.value='';send.disabled=true;status.textContent='Jose is thinking…';try{const r=await fetch('/api/chat',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await r.json();if(r.status===401){location.href='/login.html?next=chat.html';return;}if(!r.ok)throw Error(d.error||'Unable to answer');entry('jose',d.answer);status.textContent='Ready';}catch(err){entry('error',err.message);status.textContent='Unable to answer this question';}finally{send.disabled=false;field.focus();}});
</script></main></body></html>
