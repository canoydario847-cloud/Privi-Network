<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat · Hey Jose A.I.S.</title><style>
:root{color-scheme:dark;--bg:#090e1b;--panel:#101827;--line:#30394b;--text:#f3f4fa;--muted:#bbc3d3;--gold:#f5c582}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Inter",system-ui,sans-serif}
.shell{width:min(1160px,92%);margin:auto}header{border-bottom:1px solid var(--line);background:#0a101e}header .shell,footer .shell,.bar{display:flex;align-items:center;justify-content:space-between;gap:18px}header .shell{min-height:68px}nav{display:flex;gap:clamp(10px,2vw,28px);align-items:center;flex-wrap:wrap}a{color:inherit;text-decoration:none}a:hover{color:var(--gold)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #a5cfff;outline-offset:3px}.brand{display:inline-flex;align-items:center;gap:10px;font-weight:750;white-space:nowrap}.brand i{width:25px;height:25px;display:block;border:2px solid var(--gold);border-radius:50%;position:relative}.brand i:after{content:'';position:absolute;inset:7px -7px;border:2px solid var(--gold);border-radius:50%;transform:rotate(-32deg)}header nav{font-size:.9rem;color:var(--muted)}
.hero{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 76% 30%,#35415a 0%,#1d283f 23%,#101a2b 49%,#090e1b 80%);border-bottom:1px solid var(--line)}
.hero:before{content:'';position:absolute;inset:0;z-index:-2;background-image:radial-gradient(1px 1px at 15px 27px,#fff 85%,transparent),radial-gradient(1.4px 1.4px at 104px 86px,#cde1ff 70%,transparent),radial-gradient(1px 1px at 66px 41px,#fff 65%,transparent);background-size:127px 113px,241px 199px,193px 157px;opacity:.54}.hero .shell{min-height:380px;display:grid;align-content:center;position:relative}.hero-copy{position:relative;z-index:1;width:max-content;max-width:58%;padding:48px 0}.eyebrow{color:var(--gold);font:600 .76rem/1.5 ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase;margin:0 0 12px}
h1,h2,p{margin-top:0}h1{font-size:clamp(3.8rem,7.2vw,7rem);letter-spacing:-.075em;line-height:.95;margin-bottom:16px}h1 small{font-size:.43em;letter-spacing:-.045em;color:#f2d9b6}.subtitle{color:#d0d9ea;font-size:clamp(1rem,2vw,1.45rem);margin:0 0 25px}.actions{display:flex;flex-wrap:wrap;gap:12px}.cta,button{font:600 .92rem/1.25 inherit;font-family:inherit;cursor:pointer}.cta,button{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid var(--line);padding:11px 17px;color:var(--text);background:#192336;font-weight:650}.primary{color:#1e1820;background:var(--gold);border-color:var(--gold)}a.primary:hover,button.primary:hover{background:#ffdab0;color:#18131c}button:disabled{opacity:.55;cursor:default}
.space-art{position:absolute;pointer-events:none;width:min(45vw,530px);aspect-ratio:1.7;right:1%;top:49%;transform:translateY(-50%) rotate(-23deg);z-index:-1}.globe{position:absolute;left:29%;top:14%;width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 28% 20%,#ffebbc55,transparent 43%),radial-gradient(circle at 22% 25%,transparent 25%,#1b182553 61%,#070d1c 94%),repeating-linear-gradient(3deg,#d7a574 0%,#e7bd86 5%,#b88866 8%,#e5bb90 12%,#d8aa7a 17%);box-shadow:inset 3px 1px 5px #ffe1a9,8px 8px 40px #090e1b66}.rings{position:absolute;left:0;top:35%;width:100%;height:32%;border-radius:50%;background:repeating-radial-gradient(ellipse closest-side,transparent 0 49%,#927c7155 50% 53%,#e1c399 54% 59%,#a48776 60% 61%,#d6b18b 62% 69%,#e2cbb0 70% 72%,#806d64 73% 74%,#bdab97 75% 79%,transparent 80% 82%,#b1947e 83% 89%,#bfa892 90% 94%,transparent 95% 100%)}.front{clip-path:inset(50% 0 0)}.moon{position:absolute;width:7%;aspect-ratio:1;right:13%;top:3%;border-radius:50%;background:radial-gradient(circle at 28% 25%,#eee3cf,#8d8291 36%,#252b42 69%,#121a2b)}.distant{position:absolute;left:14%;top:78%;width:3.5%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 25% 20%,#99d5f8,#3d669f 43%,#151f35 79%)}
.workspace{margin:36px auto}.bar{align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}h2{font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.045em;margin-bottom:4px}.muted,#status,#description{color:var(--muted)}#status{margin:0}.panels{display:grid;grid-template-columns:minmax(0,.94fr) minmax(0,1.06fr);gap:16px}.panel{min-width:0;background:linear-gradient(130deg,#172031,var(--panel) 80%);border:1px solid var(--line);border-radius:16px;padding:clamp(17px,3vw,30px)}h3{font-size:1.2rem;letter-spacing:-.02em;margin:0 0 15px}label,summary{display:block;font-size:.91rem;font-weight:650;margin:15px 0 6px}summary{cursor:pointer;color:#e7cba3}input,textarea,select{width:100%;font:inherit;background:#0a111f;border:1px solid #465166;color:var(--text);padding:11px;border-radius:8px}textarea,pre{font: .92rem/1.55 ui-monospace,monospace}textarea{resize:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto}.terms{font-size:.86rem;color:var(--muted);margin:12px 0 18px}#output:not(:empty){padding:14px;background:#090f1b;border-radius:8px}#network{margin:24px auto 40px}footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.85rem}
@media(max-width:720px){.hero .shell{min-height:330px}.space-art{width:54vw;right:-9%;top:35%}.hero-copy{max-width:69%}.panels{grid-template-columns:1fr}.actions{gap:8px}header .shell{min-height:58px}.workspace{margin-top:26px}}@media(max-width:460px){header nav{gap:10px;font-size:.8rem}.hero .shell{min-height:355px;align-content:end}.hero-copy{max-width:100%;padding:115px 0 26px}.space-art{width:54vw;right:0;top:19%}h1{font-size:3.6rem}.hero-copy .eyebrow{margin-bottom:7px}.cta{padding:10px 13px}}

.conversation{min-height:160px;max-height:56vh;overflow:auto;display:flex;flex-direction:column;gap:12px}.entry{align-self:flex-start;max-width:min(85%,720px);white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 16px;background:#222f46;border-radius:14px}.entry.user{align-self:flex-end;background:#514235}.entry.error{color:#ffc7c7}.conversation:empty{min-height:30px}.chat-form{margin-top:20px}.chat-form button{margin-top:10px}.speak-toggle{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--muted)}.speak-toggle input{width:auto}.hero .shell{min-height:235px}.hero-copy{padding:26px 0}.space-art{max-width:380px}.chat-heading{font-size:clamp(2.6rem,6vw,5.4rem)}@media(max-width:460px){.hero .shell{min-height:260px}.hero-copy{padding-top:115px}.space-art{top:21%}}

.solar{position:absolute;right:0;top:50%;width:min(47vw,545px);aspect-ratio:1.7;transform:translateY(-50%) rotate(-14deg);pointer-events:none;z-index:-1}.sun{position:absolute;left:50%;top:50%;width:12%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 40%,#fffadb 0%,#ffe8a5 32%,#ffc36b 68%,#ea7f3d);box-shadow:0 0 14px #ffd080,0 0 42px #ffb353a1,0 0 90px #df813e77}
.orbit{position:absolute;inset:var(--oy) var(--ox);border:1px solid #bbb7ce42;border-radius:50%}.traveler{position:absolute;inset:0 auto auto 0;width:var(--size);aspect-ratio:1;offset-path:ellipse(50% 50% at 50% 50%) border-box;offset-rotate:0deg;animation:orbit var(--period) linear infinite;animation-delay:var(--phase);border-radius:50%;background:radial-gradient(circle at 30% 24%,var(--light),var(--base) 45%,#17192c 85%);box-shadow:inset 1px 1px 2px #ffffff55}
.orbit.inner{--ox:35%;--oy:35%;--size:7%;--period:13s;--phase:-3s;--light:#f9dfc5;--base:#ce8151}
.orbit.blue{--ox:23%;--oy:24%;--size:6%;--period:22s;--phase:-17s;--light:#c8f0fb;--base:#437bb6}
.orbit.ringed{--ox:11%;--oy:13%;--size:12%;--period:34s;--phase:-2s;--light:#f5d6a4;--base:#bf8e68}.ringed .traveler:after{content:"";position:absolute;inset:34% -42%;border:3px double #dec49e;border-radius:50%;transform:rotate(-14deg);box-shadow:0 1px 0 #93735e}
.orbit.outer{--ox:1%;--oy:2%;--size:4%;--period:47s;--phase:-23s;--light:#c8ceff;--base:#6e71b4}
@keyframes orbit{to{offset-distance:100%}}.paused .traveler{animation-play-state:paused}.motion{position:absolute;bottom:10px;right:1%;font-size:.76rem;padding:6px 10px;background:#101828e8;color:#e7daff;z-index:2}
@media(prefers-reduced-motion:reduce){.traveler{animation-play-state:paused}.playing .traveler{animation-play-state:running}}
@media(max-width:720px){.solar{width:47vw;right:-1%;top:34%}}@media(max-width:460px){.solar{top:21%;width:51vw}.motion{top:10px;bottom:auto;right:auto;left:0}.hero .shell{min-height:360px}}
</style></head><body><header><div class="shell"><span class="brand"><i aria-hidden="true"></i>Privi World</span><nav><a href="https://jose-site-21hs.onrender.com/#workspace" data-en="Tool workspace" data-es="Herramientas">Tool workspace</a><a href="/dashboard.html" data-en="My apps" data-es="Mis aplicaciones">My apps</a><button id="language" class="lang" type="button">Español</button></nav></div></header><main>
<section class="hero"><div class="shell"><div class="solar" aria-hidden="true"><span class="sun"></span><span class="orbit inner"><i class="traveler"></i></span><span class="orbit blue"><i class="traveler"></i></span><span class="orbit ringed"><i class="traveler"></i></span><span class="orbit outer"><i class="traveler"></i></span></div><button type="button" id="orbit-motion" class="motion" aria-label="Pause planetary orbits">Pause orbits</button><div class="hero-copy"><p class="eyebrow">Hey Jose A.I.S.</p><h1 class="chat-heading" data-en="Chat with Jose" data-es="Habla con Jose">Chat with Jose</h1></div></div></section>
<section class="shell workspace panel"><p id="status" role="status">Checking AI availability…</p><div id="conversation" class="conversation" role="log" aria-live="polite"></div>
<form id="chat" class="chat-form"><label for="message" data-en="Your message" data-es="Tu mensaje">Your message</label><textarea id="message" rows="3" maxlength="2000" placeholder="Ask in English or Spanish… / Pregunta en inglés o español…" required></textarea><div class="actions"><button class="primary" id="send" type="submit"><span data-en="Send message →" data-es="Enviar mensaje →">Send message →</span></button><button id="voice" type="button"><span data-en="🎙 Speak to Jose" data-es="🎙 Hablar con Jose">🎙 Speak to Jose</span></button><label class="speak-toggle"><input id="speak" type="checkbox"><span data-en="Read replies aloud" data-es="Leer respuestas en voz alta">Read replies aloud</span></label></div></form></section><script>
const log=document.getElementById('conversation'),status=document.getElementById('status'),send=document.getElementById('send');
function entry(role,text){const el=document.createElement('div');el.className='entry '+role;el.textContent=(role==='user'?(document.documentElement.lang==='es'?'Tú: ':'You: '):role==='jose'?'Jose: ':'')+text;log.append(el);log.scrollTop=log.scrollHeight;if(role==='jose'&&document.getElementById('speak').checked&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text));}}
fetch('/api/chat/status',{credentials:'same-origin'}).then(async r=>{if(r.status===401){location.href='/login.html?next=chat.html';return;}const d=await r.json();status.textContent=d.available?(document.documentElement.lang==='es'?'Jose está listo para responder.':'Jose is ready for questions.'):(document.documentElement.lang==='es'?'El proveedor de IA aún no está configurado.':'AI provider not configured. Contact Privi support to enable answers.');}).catch(()=>status.textContent='Could not check the AI service.');
document.getElementById('language').addEventListener('click',()=>setLanguage(document.documentElement.lang==='en'?'es':'en'));
function setLanguage(lang){document.documentElement.lang=lang;localStorage.setItem('jose-language',lang);document.querySelectorAll('[data-en][data-es]').forEach(el=>el.textContent=el.dataset[lang]);document.getElementById('language').textContent=lang==='en'?'Español':'English';}
setLanguage(localStorage.getItem('jose-language')||'en');
document.getElementById('voice').addEventListener('click',()=>{const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){status.textContent=document.documentElement.lang==='es'?'El dictado por voz no está disponible en este navegador.':'Voice input is not available in this browser.';return;}const recognition=new SpeechRecognition();recognition.lang=document.documentElement.lang==='es'?'es-ES':'en-US';recognition.interimResults=false;recognition.onresult=event=>{document.getElementById('message').value=event.results[0][0].transcript;document.getElementById('message').focus();};recognition.onerror=()=>{status.textContent=document.documentElement.lang==='es'?'No se pudo reconocer la voz. Inténtalo de nuevo.':'Voice input failed. Please try again.';};recognition.start();});
document.getElementById('chat').addEventListener('submit',async e=>{e.preventDefault();const field=document.getElementById('message'),message=field.value.trim();if(!message)return;entry('user',message);field.value='';send.disabled=true;status.textContent='Jose is thinking…';try{const r=await fetch('/api/chat',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await r.json();if(r.status===401){location.href='/login.html?next=chat.html';return;}if(!r.ok)throw Error(d.error||'Unable to answer');entry('jose',d.answer);status.textContent='Ready';}catch(err){entry('error',err.message);status.textContent='Unable to answer this question';}finally{send.disabled=false;field.focus();}});
</script></main><script>
(() => {
  const scene = document.querySelector(".solar");
  const button = document.getElementById("orbit-motion");
  const preference = window.matchMedia("(prefers-reduced-motion: reduce)");
  let paused = preference.matches;
  function update() {
    scene.classList.toggle("paused", paused);
    scene.classList.toggle("playing", !paused);
    button.textContent = paused ? "Play orbits" : "Pause orbits";
    button.setAttribute("aria-label", paused ? "Play planetary orbits" : "Pause planetary orbits");
  }
  button.addEventListener("click", () => { paused = !paused; update(); });
  preference.addEventListener("change", event => { paused = event.matches; update(); });
  update();
})();
</script></body></html>
