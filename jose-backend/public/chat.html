<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090e1b">
<title>Hey Jose · Ask anything</title>
<style>
:root{color-scheme:dark;--bg:#090e1b;--panel:#131a2b;--line:#3b4055;--text:#f6f0e8;--muted:#b8b5c9;--gold:#f5c582;--violet:#b2a1ea}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
body{background:radial-gradient(circle at 95% 0%,#38224b55,transparent 36%),linear-gradient(160deg,#090e1b,#111321)}
button,textarea{font:inherit}
button{cursor:pointer;color:var(--text);background:#1c2335;border:1px solid var(--line);border-radius:9px;padding:9px 13px}
button:hover{background:#2c3347}button:disabled{opacity:.55;cursor:default}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:1120px;margin:0 auto}
header{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;border-bottom:1px solid #ffffff17}
.brand{font:700 21px Georgia,serif;letter-spacing:.03em;color:var(--gold);text-shadow:0 0 16px #e08b4c33}
.brand span{color:#e9d8f6}header .actions{display:flex;gap:8px}
.iconbutton{border-color:transparent;background:transparent;padding:7px 10px;color:var(--muted);font-size:13px}
.iconbutton:hover{color:var(--text)}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#feed{flex:1;overflow-y:auto;min-height:160px;scrollbar-color:#4e546a transparent;padding:23px 22px 40px;display:flex;flex-direction:column;gap:22px}
.welcome{margin:auto;text-align:center;max-width:660px;padding:48px 16px}
.welcome .emblem{display:inline-grid;place-items:center;width:64px;height:64px;border:1px solid #edbb81aa;transform:rotate(-14deg);border-radius:45%;color:var(--gold);font:34px Georgia,serif;box-shadow:0 0 45px #9e61372c}
h1{font:600 clamp(30px,5vw,48px)/1.2 Georgia,serif;letter-spacing:-.04em;margin:22px 0 8px}
.welcome p{margin:0;color:var(--muted);font-size:15px}
.bubble{max-width:min(860px,93%);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.68}
.bubble.user{align-self:flex-end;background:#2d263c;border:1px solid #6b547a70;border-radius:20px 20px 5px 20px;padding:12px 17px}
.bubble.jose{align-self:flex-start;padding:5px 0 10px 34px;position:relative;width:100%}
.bubble.jose:before{content:'✦';position:absolute;top:1px;left:0;color:var(--gold);font-size:21px}
.bubble.error{color:#ffc8bc;border-left:3px solid #eb8b73;padding:10px 15px;align-self:flex-start}
#artifact{padding:10px 22px 15px}
#artifact .bar{display:flex;gap:8px;flex-wrap:wrap}
#preview{margin-top:10px;border-radius:9px;background:white;width:100%;height:400px;border:1px solid #515c77}
.composer-area{padding:13px 18px max(15px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#090e1b 22%)}
.composer{max-width:880px;margin:0 auto;border:1px solid #56506b;background:#161827;border-radius:21px;box-shadow:0 10px 40px #0005}
textarea{resize:none;display:block;min-height:58px;max-height:180px;width:100%;border:0;background:transparent;color:var(--text);padding:17px 18px 7px;outline:0}
textarea::placeholder{color:#aaa7b9}
.composer .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 10px 9px}
.tools{display:flex;align-items:center;gap:5px}
.tools button{border:0;background:transparent;font-size:20px;min-width:40px;height:38px;padding:4px 9px}
.tools button:hover{background:#2b3042}
.send{background:var(--gold);border-color:var(--gold);color:#241b20;font-weight:700;min-width:82px}
.send:hover{background:#ffe0ae}
#status{min-height:19px;max-width:880px;margin:8px auto 0;color:var(--muted);font-size:12px;text-align:center}
#attachmentStatus{max-width:880px;margin:5px auto 0;color:var(--muted);font-size:12px;text-align:center}
#attachmentStatus:empty{display:none}
@media(max-width:650px){header{padding:9px 12px}.brand{font-size:18px}.iconbutton{padding:7px 5px}#feed{padding:18px 12px}.composer-area{padding:8px 8px 14px}.welcome{padding:38px 8px}.bubble.jose{padding-left:28px}.send{min-width:72px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand" aria-label="Hey Jose">Hey <span>Jose</span> ✦</div>
  <div class="actions">
    <button class="iconbutton" id="newChat" type="button" title="New conversation">New chat</button>
    <button class="iconbutton" id="copyReply" type="button" title="Copy last answer">Copy</button>
    <button class="iconbutton" id="exportChat" type="button" title="Export conversation">Export</button>
  </div>
</header>
<main>
  <div id="feed" role="log" aria-label="Conversation" aria-live="polite">
    <section class="welcome" id="welcome"><div class="emblem" aria-hidden="true">✦</div><h1>What can I help you with?</h1><p>Ask anything. Jose can help with everyday questions, writing, coding and Web3 ideas—all here in one conversation.</p></section>
  </div>
  <div id="artifact" hidden><div class="bar"><button id="downloadApp" type="button">Download generated HTML</button><button id="previewApp" type="button">Preview here</button></div><iframe id="preview" title="Isolated app preview" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe></div>
</main>
<div class="composer-area">
  <form class="composer" id="chat">
    <label for="message" class="visually-hidden" style="position:absolute;left:-10000px">Your question</label>
    <textarea id="message" rows="2" maxlength="12000" placeholder="Ask Hey Jose anything…" aria-label="Ask Hey Jose anything" required></textarea>
    <div class="toolbar"><div class="tools">
      <button id="attach" type="button" title="Attach image or text file" aria-label="Attach file">＋</button>
      <button id="clearAttachment" type="button" title="Remove attachment" aria-label="Remove attachment" hidden>×</button>
      <button id="voice" type="button" title="Dictate your question" aria-label="Use microphone">🎙</button>
    </div><button id="send" class="send" type="submit">Send ↑</button></div>
    <input id="attachmentFile" type="file" accept="image/png,image/jpeg,image/webp,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.sol,.xml,.yaml,.yml,.log,.sql" hidden>
  </form>
  <p id="attachmentStatus" role="status"></p>
  <p id="status" role="status">Connecting to Jose…</p>
</div>
</div>
<script>
const feed=document.getElementById('feed');
const input=document.getElementById('message');
const status=document.getElementById('status');
const form=document.getElementById('chat');
const send=document.getElementById('send');
const history=[];
let running=false,generatedApp='';
window.joseChatHistory=history;
function showWelcome(show){document.getElementById('welcome').hidden=!show;}
function showMessage(role,message){
  showWelcome(false);
  const node=document.createElement('div');
  node.className='bubble '+role;
  node.textContent=message;
  feed.append(node);
  node.scrollIntoView({block:'end',behavior:'smooth'});
}
function artifactFromAnswer(message){
  const matched=String(message).match(/\x60{3}html\s*([\s\S]*?)\x60{3}/i);
  const html=(matched?matched[1]:message).trim();
  if(/^(?:<!doctype\s+html|<html[\s>])/i.test(html)&&/<\/html\s*>/i.test(html))return html;
  return '';
}
function clearArtifact(){
  generatedApp='';
  document.getElementById('artifact').hidden=true;
  const frame=document.getElementById('preview');
  frame.hidden=true;
  frame.removeAttribute('srcdoc');
}
window.joseResetChat=()=>{
  if(running)return;
  history.length=0;
  [...feed.querySelectorAll('.bubble')].forEach(node=>node.remove());
  clearArtifact();showWelcome(true);input.value='';
  input.focus();
};
document.getElementById('downloadApp').addEventListener('click',()=>{
  if(!generatedApp)return;
  const url=URL.createObjectURL(new Blob([generatedApp],{type:'text/html;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='hey-jose-app.html';
  document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});
document.getElementById('previewApp').addEventListener('click',()=>{
  if(!generatedApp)return;
  const frame=document.getElementById('preview');
  frame.srcdoc=generatedApp;frame.hidden=false;
});
document.getElementById('voice').addEventListener('click',()=>{
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){status.textContent='Microphone dictation is not supported in this browser.';return;}
  const recognition=new SpeechRecognition();
  recognition.lang=document.documentElement.lang==='es'?'es-ES':'en-US';
  recognition.onresult=e=>{input.value=e.results[0][0].transcript;input.focus();};
  recognition.onerror=()=>{status.textContent='Microphone recognition failed. Try typing your question.';};
  recognition.start();
});
input.addEventListener('keydown',event=>{
  if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){
    event.preventDefault();
    if(!running)form.requestSubmit();
  }
});
window.addEventListener('message',event=>{
  if(event.origin!=='https://jose-site-21hs.onrender.com'||
     event.data?.type!=='jose-initial-message'||
     typeof event.data.message!=='string')return;
  input.value=event.data.message.slice(0,12000);
  if(input.value.trim()&&!running)form.requestSubmit();
});
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(running)return;
  const message=input.value.trim();
  if(!message)return;
  const attachment=window.joseAddons?.getAttachment?.()||null;
  running=true;send.disabled=true;input.disabled=true;
  showMessage('user',message+(attachment?'\n[Attached '+attachment.kind+': '+attachment.name+']':''));
  input.value='';
  clearArtifact();
  status.textContent='Jose is answering…';
  try {
    const r=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
      body:JSON.stringify({message,history:history.slice(-16),attachments:attachment?[attachment]:[]})
    });
    const data=await r.json().catch(()=>({error:'Jose returned an invalid response.'}));
    if(!r.ok)throw new Error(data.error||'Unable to answer.');
    if(typeof data.answer!=='string'||!data.answer.trim())throw new Error('Jose did not return an answer.');
    showMessage('jose',data.answer);
    window.joseAddons?.onSent?.(data.answer);
    history.push({role:'user',content:message},{role:'assistant',content:data.answer.slice(0,12000)});
    while(history.length>16||history.reduce((n,item)=>n+item.content.length,0)>42000)history.splice(0,2);
    if(data.mode==='build'){
      generatedApp=artifactFromAnswer(data.answer);
      document.getElementById('artifact').hidden=!generatedApp;
    }
    status.textContent='';
  } catch(error){
    showMessage('error',error.message||'Jose could not answer your question.');
    input.value=message;
    status.textContent='The answer failed. Check the message above and retry.';
  } finally {
    input.disabled=false;send.disabled=false;running=false;input.focus();
  }
});
fetch('/api/chat/status',{credentials:'same-origin'}).then(async r=>{
  if(!r.ok)throw new Error('Status unavailable');
  const d=await r.json();
  status.textContent=d.available?'':"Jose AI is not configured. The site operator must connect an AI provider before answers work.";
}).catch(()=>{status.textContent='Could not reach Jose. Try refreshing the page.';});
input.focus();
</script>
<script src="/chat-extras.js?v=20261123-onechat"></script>
</body>
</html>
